<!doctype html>
{{- $d := partial "primadom/page-types/ai-answer/_data.html" . -}}
{{- $t := $d.t -}}
<html lang="{{ $d.lang }}" dir="{{ $t._language.dir | default "ltr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ $t.seo.title }}</title>
  <meta name="description" content="{{ $t.seo.description }}">
  <link rel="canonical" href="{{ $t.seo.canonical }}">
  <link rel="stylesheet" href="{{ "css/primadom/page-ai-answer.css" | relURL }}">
  {{ partial "primadom/page-types/ai-answer/schema.html" . }}
</head>
<body class="page-ai-answer">
  {{ partial "primadom/page-types/ai-answer/ai_answer_page.html" . }}
</body>
</html>
