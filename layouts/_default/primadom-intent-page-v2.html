{{- $d := partial "primadom/page-types/intent-v2/_data.html" . -}}
{{- $p := $d.page -}}
{{- $t := $d.t -}}

<!doctype html>

<html lang="{{ $p.language_code }}" dir="ltr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>{{ $t.hero.title }} — Primadom AI</title>

  <meta
    name="description"
    content="{{ $t.answer.body_text }}"
  >

  <link
    rel="canonical"
    href="{{ $p.canonical_url_path | absURL }}"
  >

  <link
    rel="stylesheet"
    href="{{ "css/primadom/page-intent.css" | relURL }}"
  >

  {{ partial "primadom/page-types/intent-v2/schema.html" . }}

</head>


<body class="page-intent">

  {{ partial "primadom/page-types/intent-v2/intent_page.html" . }}

</body>

</html>
