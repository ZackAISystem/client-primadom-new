{{ with .Params.page_id }}
<script>
(() => {
  "use strict";

  const PAGE_ID = {{ . | jsonify | safeJS }};
  const ENDPOINT = "/api/analytics/v1/collect";
  const SESSION_TIMEOUT_MS = 30 * 60 * 1000;

  const VISITOR_KEY = "primadom_analytics_visitor_id_v1";
  const SESSION_KEY = "primadom_analytics_session_v1";

  const UUID_RE =
    /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

  function uuidV4() {
    if (
      window.crypto &&
      typeof window.crypto.randomUUID === "function"
    ) {
      return window.crypto.randomUUID();
    }

    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);

    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;

    const hex = [...bytes]
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");

    return [
      hex.slice(0, 8),
      hex.slice(8, 12),
      hex.slice(12, 16),
      hex.slice(16, 20),
      hex.slice(20)
    ].join("-");
  }

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  }

  function getVisitorId() {
    let id = storageGet(VISITOR_KEY);

    if (!UUID_RE.test(id || "")) {
      id = uuidV4();
      storageSet(VISITOR_KEY, id);
    }

    return id;
  }

  function getSessionId(nowMs) {
    let state = null;

    try {
      state = JSON.parse(storageGet(SESSION_KEY) || "null");
    } catch {
      state = null;
    }

    const reusable =
      state &&
      UUID_RE.test(state.id || "") &&
      Number.isFinite(Number(state.last_activity_at)) &&
      nowMs - Number(state.last_activity_at) >= 0 &&
      nowMs - Number(state.last_activity_at) <= SESSION_TIMEOUT_MS;

    const id = reusable ? state.id : uuidV4();

    storageSet(
      SESSION_KEY,
      JSON.stringify({
        id,
        last_activity_at: nowMs
      })
    );

    return id;
  }

  function acquisitionEvidence() {
    const acquisition = {};
    const params = new URLSearchParams(window.location.search);

    if (document.referrer) {
      try {
        const ref = new URL(document.referrer);

        acquisition.referrer_host =
          ref.hostname.toLowerCase();

        acquisition.referrer_path =
          ref.pathname || "/";
      } catch {
        // Ignore malformed referrer.
      }
    }

    const utmKeys = [
      "utm_source",
      "utm_medium",
      "utm_campaign",
      "utm_id",
      "utm_term",
      "utm_content"
    ];

    for (const key of utmKeys) {
      const value = params.get(key);

      if (value) {
        acquisition[key] = value.slice(0, 500);
      }
    }

    const clickIdKeys = [
      "gclid",
      "gbraid",
      "wbraid",
      "msclkid",
      "dclid",
      "fbclid",
      "ttclid",
      "li_fat_id",
      "twclid",
      "yclid",
      "epik",
      "rdt_cid"
    ];

    const clickIds = {};

    for (const key of clickIdKeys) {
      const value = params.get(key);

      if (value) {
        clickIds[key] = value.slice(0, 500);
      }
    }

    if (Object.keys(clickIds).length > 0) {
      acquisition.click_ids = clickIds;
    }

    return acquisition;
  }

  const nowMs = Date.now();

  const visitorId = getVisitorId();
  const sessionId = getSessionId(nowMs);
  const pageviewId = uuidV4();

  function touchSessionActivity(activityMs = Date.now()) {
    storageSet(
      SESSION_KEY,
      JSON.stringify({
        id: sessionId,
        last_activity_at: activityMs
      })
    );
  }

  async function sendPayload(payload, attempt = 0) {
    try {
      const response = await fetch(ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "omit",
        cache: "no-store",
        keepalive: true,
        body: JSON.stringify(payload)
      });

      if (
        !response.ok &&
        response.status >= 500 &&
        attempt === 0
      ) {
        await new Promise((resolve) => {
          window.setTimeout(resolve, 750);
        });

        return sendPayload(payload, 1);
      }

      return response.ok;
    } catch {
      if (attempt === 0) {
        await new Promise((resolve) => {
          window.setTimeout(resolve, 750);
        });

        return sendPayload(payload, 1);
      }

      return false;
    }
  }

  const pageViewPayload = {
    schema_version: "1.0",
    event_id: uuidV4(),
    event_name: "page_view",
    occurred_at: new Date(nowMs).toISOString(),
    visitor_id: visitorId,
    session_id: sessionId,
    pageview_id: pageviewId,
    page_id: PAGE_ID,
    event_value: null,
    event_context: {
      context_version: "1.0"
    },
    acquisition: acquisitionEvidence()
  };

  const pageViewReady = sendPayload(pageViewPayload);

  async function emitBehaviour(
    eventName,
    eventValue = null,
    eventContext = {}
  ) {
    const ready = await pageViewReady;

    if (!ready) {
      return false;
    }

    const occurredMs = Date.now();

    const payload = {
      schema_version: "1.0",
      event_id: uuidV4(),
      event_name: eventName,
      occurred_at: new Date(occurredMs).toISOString(),
      visitor_id: visitorId,
      session_id: sessionId,
      pageview_id: pageviewId,
      page_id: PAGE_ID,
      event_value: eventValue,
      event_context: {
        context_version: "1.0",
        ...eventContext
      }
    };

    const accepted = await sendPayload(payload);

    if (accepted) {
      touchSessionActivity(occurredMs);
    }

    return accepted;
  }

  const scrollMilestones = [25, 50, 75, 90, 100];
  const sentScrollMilestones = new Set();

  let reachedTwentyFivePercent = false;
  let meaningfulInteractionOccurred = false;
  let engagedSent = false;

  let activeVisibleMs = 0;
  let activeTickStartedAt = null;

  function isActiveVisible() {
    return (
      document.visibilityState === "visible" &&
      document.hasFocus()
    );
  }

  function updateActiveClock() {
    const now = Date.now();

    if (
      activeTickStartedAt !== null &&
      isActiveVisible()
    ) {
      activeVisibleMs += Math.max(
        0,
        now - activeTickStartedAt
      );
    }

    activeTickStartedAt =
      isActiveVisible() ? now : null;
  }

  function maybeSendEngagedView() {
    if (engagedSent) {
      return;
    }

    updateActiveClock();

    const engagedByScroll =
      activeVisibleMs >= 10 * 1000 &&
      reachedTwentyFivePercent;

    const engagedByInteraction =
      activeVisibleMs >= 10 * 1000 &&
      meaningfulInteractionOccurred;

    const engagedByTime =
      activeVisibleMs >= 30 * 1000;

    if (
      !engagedByScroll &&
      !engagedByInteraction &&
      !engagedByTime
    ) {
      return;
    }

    engagedSent = true;

    let actionType = "active_30s";

    if (engagedByScroll) {
      actionType = "active_10s_plus_scroll_25";
    } else if (engagedByInteraction) {
      actionType = "active_10s_plus_interaction";
    }

    emitBehaviour(
      "engaged_view",
      null,
      {
        duration_ms: Math.round(activeVisibleMs),
        action_type: actionType
      }
    );
  }

  function currentScrollPercent() {
    const doc = document.documentElement;

    const scrollTop =
      window.scrollY ||
      doc.scrollTop ||
      0;

    const scrollable =
      Math.max(
        doc.scrollHeight,
        document.body?.scrollHeight || 0
      ) - window.innerHeight;

    if (scrollable <= 0) {
      return 0;
    }

    return Math.min(
      100,
      Math.max(
        0,
        (scrollTop / scrollable) * 100
      )
    );
  }

  let scrollFramePending = false;

  function processScroll() {
    scrollFramePending = false;

    const depth = currentScrollPercent();

    for (const milestone of scrollMilestones) {
      if (
        depth >= milestone &&
        !sentScrollMilestones.has(milestone)
      ) {
        sentScrollMilestones.add(milestone);

        if (milestone >= 25) {
          reachedTwentyFivePercent = true;
        }

        emitBehaviour(
          "scroll_depth",
          milestone,
          {
            milestone
          }
        );
      }
    }

    maybeSendEngagedView();
  }

  function onScroll() {
    if (scrollFramePending) {
      return;
    }

    scrollFramePending = true;

    window.requestAnimationFrame(processScroll);
  }

  function resetActiveClock() {
    updateActiveClock();
  }

  document.addEventListener(
    "visibilitychange",
    resetActiveClock
  );

  window.addEventListener(
    "focus",
    resetActiveClock
  );

  window.addEventListener(
    "blur",
    resetActiveClock
  );

  window.addEventListener(
    "scroll",
    onScroll,
    { passive: true }
  );

  const TRACKED_LANGUAGES = new Set([
    "en",
    "ru",
    "hi",
    "zh",
    "es",
    "fr",
    "de",
    "ar"
  ]);

  function markMeaningfulInteraction() {
    meaningfulInteractionOccurred = true;
    maybeSendEngagedView();
  }

  function isMeaningfulSection(section) {
    if (!(section instanceof HTMLElement)) {
      return false;
    }

    if (!section.id) {
      return false;
    }

    if (
      section.closest(
        '[role="dialog"], [aria-modal="true"]'
      )
    ) {
      return false;
    }

    if (
      section.hidden ||
      section.getAttribute("aria-hidden") === "true"
    ) {
      return false;
    }

    const id = section.id.toLowerCase();

    if (id.includes("modal")) {
      return false;
    }

    return true;
  }

  function sectionVisibilityQualified(section) {
    if (document.visibilityState !== "visible") {
      return false;
    }

    if (
      section.hidden ||
      section.getAttribute("aria-hidden") === "true"
    ) {
      return false;
    }

    const style = window.getComputedStyle(section);

    if (
      style.display === "none" ||
      style.visibility === "hidden"
    ) {
      return false;
    }

    const rect = section.getBoundingClientRect();

    if (
      rect.height <= 0 ||
      rect.width <= 0
    ) {
      return false;
    }

    const visibleTop = Math.max(
      0,
      rect.top
    );

    const visibleBottom = Math.min(
      window.innerHeight,
      rect.bottom
    );

    const visiblePixels = Math.max(
      0,
      visibleBottom - visibleTop
    );

    const requiredPixels = Math.min(
      rect.height * 0.5,
      window.innerHeight * 0.5
    );

    return visiblePixels >= requiredPixels;
  }

  const trackedSections = Array.from(
    document.querySelectorAll("section[id]")
  ).filter(isMeaningfulSection);

  const sectionPositions = new Map(
    trackedSections.map(
      (section, index) => [
        section,
        index + 1
      ]
    )
  );

  const sentSectionViews = new Set();
  const sectionVisibleSince = new Map();

  function processSectionVisibility() {
    const now = Date.now();

    for (const section of trackedSections) {
      const sectionKey = section.id;

      if (sentSectionViews.has(sectionKey)) {
        continue;
      }

      if (!sectionVisibilityQualified(section)) {
        sectionVisibleSince.delete(sectionKey);
        continue;
      }

      const visibleSince =
        sectionVisibleSince.get(sectionKey);

      if (visibleSince === undefined) {
        sectionVisibleSince.set(
          sectionKey,
          now
        );

        continue;
      }

      const durationMs =
        now - visibleSince;

      if (durationMs < 1000) {
        continue;
      }

      sentSectionViews.add(sectionKey);
      sectionVisibleSince.delete(sectionKey);

      emitBehaviour(
        "section_view",
        null,
        {
          section_key: sectionKey,
          section_position:
            sectionPositions.get(section) || null,
          duration_ms: Math.round(durationMs)
        }
      );
    }
  }

  function routeInfo(pathname) {
    const segments = pathname
      .split("/")
      .filter(Boolean);

    let language = null;
    let offset = 0;

    if (
      segments.length > 0 &&
      TRACKED_LANGUAGES.has(
        segments[0].toLowerCase()
      )
    ) {
      language =
        segments[0].toLowerCase();

      offset = 1;
    }

    return {
      language,
      family:
        (
          segments[offset] || ""
        ).toLowerCase(),
      slug:
        segments[offset + 1] || null
    };
  }

  function analyticsSectionKey(element) {
    const breadcrumb = element.closest(
      'nav[aria-label*="breadcrumb" i], [class*="breadcrumbs"]'
    );

    if (breadcrumb) {
      return "breadcrumbs";
    }

    const section =
      element.closest("section[id]");

    if (section?.id) {
      return section.id;
    }

    if (element.closest("header")) {
      return "header";
    }

    if (element.closest("footer")) {
      return "footer";
    }

    return "page";
  }

  function anchorPosition(anchor) {
    const container =
      anchor.closest(
        "section[id], nav, header, footer, main"
      ) ||
      document.body;

    const anchors = Array.from(
      container.querySelectorAll("a[href]")
    );

    const index =
      anchors.indexOf(anchor);

    return index >= 0
      ? index + 1
      : null;
  }

  function isManagedCtaAnchor(anchor) {
    if (
      anchor.matches(
        "[data-open-lead], [data-scroll-ask-ai]"
      )
    ) {
      return true;
    }

    for (const attribute of anchor.attributes) {
      if (
        attribute.name.startsWith(
          "data-open-"
        ) ||
        attribute.name === "data-pa-modal"
      ) {
        return true;
      }
    }

    const href =
      anchor.getAttribute("href") || "";

    return (
      href.startsWith("#") &&
      href.toLowerCase().includes("modal")
    );
  }

  function isContactDestination(url) {
    const protocol =
      url.protocol.toLowerCase();

    if (
      protocol === "mailto:" ||
      protocol === "tel:" ||
      protocol === "sms:"
    ) {
      return true;
    }

    const host =
      url.hostname.toLowerCase();

    return (
      host === "wa.me" ||
      host === "api.whatsapp.com" ||
      host.endsWith(".whatsapp.com")
    );
  }

  function navigationEventForRoute(
    targetRoute
  ) {
    const family =
      targetRoute.family;

    if (
      family.includes("comparison") ||
      family.startsWith("compare-")
    ) {
      let entityType = null;

      if (family.includes("project")) {
        entityType = "project";
      } else if (
        family.includes("district")
      ) {
        entityType = "district";
      } else if (
        family.includes("developer")
      ) {
        entityType = "developer";
      }

      if (entityType) {
        return {
          eventName: "comparison_click",
          entityType
        };
      }
    }

    if (
      family === "projects" ||
      family === "project"
    ) {
      return {
        eventName: "project_click",
        entityType: "project"
      };
    }

    if (
      family === "districts" ||
      family === "district"
    ) {
      return {
        eventName: "district_click",
        entityType: "district"
      };
    }

    if (
      family === "developers" ||
      family === "developer"
    ) {
      return {
        eventName: "developer_click",
        entityType: "developer"
      };
    }

    return null;
  }

  document.addEventListener(
    "click",
    (event) => {
      if (
        event.defaultPrevented ||
        event.button !== 0
      ) {
        return;
      }

      const target =
        event.target instanceof Element
          ? event.target
          : null;

      const anchor =
        target?.closest("a[href]");

      if (!anchor) {
        return;
      }

      if (isManagedCtaAnchor(anchor)) {
        return;
      }

      const rawHref =
        anchor.getAttribute("href");

      if (
        !rawHref ||
        rawHref === "#"
      ) {
        return;
      }

      let url;

      try {
        url = new URL(
          rawHref,
          window.location.href
        );
      } catch {
        return;
      }

      if (isContactDestination(url)) {
        return;
      }

      if (
        url.protocol !== "http:" &&
        url.protocol !== "https:"
      ) {
        return;
      }

      const sectionKey =
        analyticsSectionKey(anchor);

      const itemPosition =
        anchorPosition(anchor);

      const currentRoute =
        routeInfo(
          window.location.pathname
        );

      const targetRoute =
        routeInfo(url.pathname);

      const isInternal =
        url.origin ===
        window.location.origin;

      if (!isInternal) {
        markMeaningfulInteraction();

        emitBehaviour(
          "external_link_click",
          null,
          {
            section_key: sectionKey,
            target_host:
              url.hostname.toLowerCase(),
            link_type: "external"
          }
        );

        return;
      }

      const isBreadcrumb =
        Boolean(
          anchor.closest(
            'nav[aria-label*="breadcrumb" i], [class*="breadcrumbs"]'
          )
        );

      const languageChanged =
        currentRoute.language &&
        targetRoute.language &&
        currentRoute.language !==
          targetRoute.language;

      const samePageAnchor =
        url.pathname ===
          window.location.pathname &&
        Boolean(url.hash);

      if (
        isBreadcrumb ||
        languageChanged ||
        samePageAnchor
      ) {
        let linkType = "internal";

        if (isBreadcrumb) {
          linkType = "breadcrumb";
        } else if (languageChanged) {
          linkType = "language_switch";
        } else if (samePageAnchor) {
          linkType = "anchor";
        }

        markMeaningfulInteraction();

        emitBehaviour(
          "internal_link_click",
          null,
          {
            section_key: sectionKey,
            link_type: linkType,
            target_path: url.pathname,
            item_position: itemPosition
          }
        );

        return;
      }

      const specialised =
        navigationEventForRoute(
          targetRoute
        );

      if (specialised) {
        markMeaningfulInteraction();

        if (
          specialised.eventName ===
          "comparison_click"
        ) {
          const context = {
            comparison_entity_type:
              specialised.entityType,
            pair_key:
              targetRoute.slug,
            section_key: sectionKey,
            item_position: itemPosition,
            target_path: url.pathname
          };

          if (
            targetRoute.slug &&
            targetRoute.slug.includes(
              "-vs-"
            )
          ) {
            const parts =
              targetRoute.slug.split(
                "-vs-"
              );

            if (parts.length === 2) {
              context.left_slug =
                parts[0];

              context.right_slug =
                parts[1];
            }
          }

          emitBehaviour(
            "comparison_click",
            null,
            context
          );

          return;
        }

        emitBehaviour(
          specialised.eventName,
          null,
          {
            target_entity_slug:
              targetRoute.slug,
            section_key: sectionKey,
            item_position: itemPosition,
            target_path: url.pathname
          }
        );

        return;
      }

      markMeaningfulInteraction();

      emitBehaviour(
        "internal_link_click",
        null,
        {
          section_key: sectionKey,
          link_type: "internal",
          target_path: url.pathname,
          item_position: itemPosition
        }
      );
    },
    true
  );

  processSectionVisibility();

  window.setInterval(
    processSectionVisibility,
    250
  );

  activeTickStartedAt =
    isActiveVisible() ? Date.now() : null;

  window.setInterval(
    maybeSendEngagedView,
    1000
  );
})();
</script>
{{ end }}
