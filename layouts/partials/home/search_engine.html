<script>
(function () {
  // =========================================================
  // GetHome Search Engine (NO fetch, NO layout changes)
  // Works with:
  // - data/search/dict.json
  // Listens:
  // - search:set {q}
  // - search:updated {q}
  // - search:clear
  // =========================================================

  const LANGS = [
    "en","ru","hi","zh",
    "es","fr","de","ar"
  ];

  const STORAGE_KEY = "results_query";

  function getPageLang(){
    const l = (
      document.documentElement.getAttribute("lang")
      || "en"
    ).toLowerCase();

    return LANGS.includes(l)
      ? l
      : "en";
  }

  let ACTIVE_SEARCH_LANG = getPageLang();

  function getLang(){
    return ACTIVE_SEARCH_LANG;
  }

  // --- canonical Search V1: dictionary only, no legacy search index ---
  let DICT = {{ site.Data.search.dict | jsonify }};
  if (typeof DICT === "string") {
    try { DICT = JSON.parse(DICT); } catch(e){ DICT = {}; }
  }

  // --- Search V3 multilingual runtime projection ---
  // All 8 languages, including EN, use the same
  // versioned runtime projection contract.
  let PROJECT_PROJECTION = {};

  let PROJECT_ROWS = [];

  function buildProjectBySlug(rows){
    return new Map(
      rows
        .filter(p => p && p.slug)
        .map(p => [
          String(p.slug),
          p
        ])
    );
  }

  let PROJECT_BY_SLUG =
    buildProjectBySlug(PROJECT_ROWS);

  // No language is considered active until its
  // V3 projection has successfully loaded.
  let PROJECT_DATA_LANG = "";

  const PROJECT_PROJECTION_CACHE =
    new Map();

  const PROJECT_LOAD_PROMISES =
    new Map();

  // ---------------------------------------------------------
  // Day 3 — query language detector
  // ---------------------------------------------------------

  const LATIN_LANGUAGE_SIGNALS = {
    en: new Set([
      "apartments",
      "properties",
      "bedrooms",
      "cheaper",
      "waterfront",
      "developer",
      "developers",
      "handover",
      "alternatives",
      "earlier",
      "another"
    ]),

    es: new Set([
      "apartamento",
      "apartamentos",
      "vivienda",
      "viviendas",
      "dormitorio",
      "dormitorios",
      "inmobiliario",
      "inmobiliaria",
      "promotor",
      "promotores",
      "similares",
      "barato",
      "baratos",
      "barata",
      "baratas",
      "mismo",
      "misma",
      "otro",
      "otra",
      "entrega"
    ]),

    fr: new Set([
      "appartement",
      "appartements",
      "logement",
      "logements",
      "chambre",
      "chambres",
      "immobilier",
      "immobiliere",
      "promoteur",
      "promoteurs",
      "similaire",
      "similaires",
      "cher",
      "chers",
      "chère",
      "chères",
      "même",
      "autre",
      "livraison"
    ]),

    de: new Set([
      "wohnung",
      "wohnungen",
      "immobilie",
      "immobilien",
      "schlafzimmer",
      "guenstiger",
      "günstiger",
      "bautraeger",
      "bauträger",
      "uebergabe",
      "übergabe",
      "aehnlich",
      "ähnlich",
      "gleicher",
      "gleiche",
      "gleiches",
      "anderer",
      "andere",
      "anderen",
      "anderem",
      "bezirk",
      "gebiet",
      "frueher",
      "früher"
    ])
  };

  const LATIN_RELATION_LANGUAGE_RULES = [
    {
      lang: "en",
      patterns: [
        /\bsimilar\s+to\b/i,
        /\bcheaper\s+than\b/i,
        /\bsame\s+(?:district|area)\s+as\b/i,
        /\bsame\s+developer\s+as\b/i,
        /\bearlier\s+handover\s+than\b/i
      ]
    },

    {
      lang: "es",
      patterns: [
        /\bsimilar(?:es)?\s+a\b/i,
        /\bm[aá]s\s+barat[oa]s?\s+que\b/i,
        /\bmism[oa]\s+(?:distrito|zona)\s+que\b/i,
        /\bmism[oa]\s+(?:promotor|desarrollador)\s+que\b/i
      ]
    },

    {
      lang: "fr",
      patterns: [
        /\bsimilaires?\s+(?:à|a)(?=\s|$)/iu,
        /\bmoins\s+ch(?:er|ère|ers|ères)\s+que\b/i,
        /\bmême\s+(?:quartier|zone)\s+que\b/i,
        /\bmême\s+(?:promoteur|développeur)\s+que\b/i
      ]
    },

    {
      lang: "de",
      patterns: [
        /\b(?:ähnlich|aehnlich)\s+wie\b/i,
        /\b(?:günstiger|guenstiger)\s+als\b/i,
        /\bgleich(?:er|e|es)\s+(?:bezirk|gebiet)\b/i,
        /\bgleich(?:er|e|es)\s+(?:bauträger|bautraeger|entwickler)\b/i
      ]
    }
  ];

  function detectLatinRelationLanguage(query){
    const q = String(query || "");

    for (const rule of LATIN_RELATION_LANGUAGE_RULES) {
      if (
        rule.patterns.some(re =>
          re.test(q)
        )
      ) {
        return rule.lang;
      }
    }

    return "";
  }

  function languageWords(value){
    return (
      String(value || "")
        .toLowerCase()
        .match(/\p{L}+/gu)
      || []
    );
  }

  function detectLatinSearchLanguage(
    query,
    fallback
  ){
    const relationLang =
      detectLatinRelationLanguage(query);

    if (relationLang) {
      return relationLang;
    }

    const words =
      languageWords(query);

    if (!words.length) {
      return fallback;
    }

    const scores = {
      en: 0,
      es: 0,
      fr: 0,
      de: 0
    };

    for (const word of words) {
      for (
        const lang of [
          "en","es","fr","de"
        ]
      ) {
        if (
          LATIN_LANGUAGE_SIGNALS[
            lang
          ].has(word)
        ) {
          scores[lang]++;
        }
      }
    }

    const ranked =
      Object.entries(scores)
        .sort(
          (a, b) =>
            b[1] - a[1]
        );

    if (!ranked.length) {
      return fallback;
    }

    const [bestLang, bestScore] =
      ranked[0];

    const secondScore =
      ranked[1]?.[1] || 0;

    // One unambiguous strong word
    // is already enough.
    if (
      bestScore > 0 &&
      bestScore > secondScore
    ) {
      return bestLang;
    }

    return fallback;
  }

  function detectSearchLanguage(query){
    const q =
      String(query || "");

    // Script-level detection:
    // immediate from first meaningful
    // character.
    if (/\p{Script=Cyrillic}/u.test(q)) {
      return "ru";
    }

    if (/\p{Script=Arabic}/u.test(q)) {
      return "ar";
    }

    if (/\p{Script=Devanagari}/u.test(q)) {
      return "hi";
    }

    if (/\p{Script=Han}/u.test(q)) {
      return "zh";
    }

    return detectLatinSearchLanguage(
      q,
      ACTIVE_SEARCH_LANG
    );
  }

  window.__primadomDetectSearchLanguage = detectSearchLanguage;

  // Day 4 Homepage routing detector.
  //
  // IMPORTANT:
  // Search keeps its original Day 3 behaviour above:
  // ambiguous Latin text falls back to ACTIVE_SEARCH_LANG.
  //
  // Homepage routing is different:
  // ambiguous Latin text MUST fall back to the language
  // already present in the URL, never to mutable Search state.
  const ROUTE_LATIN_LANGUAGE_SIGNALS = {
    en: new Set([
      "hello",
      "thanks"
    ]),

    es: new Set([
      "hola",
      "gracias"
    ]),

    fr: new Set([
      "bonjour",
      "merci"
    ]),

    de: new Set([
      "hallo",
      "danke"
    ])
  };

  function detectRouteLatinLanguage(query) {
    const words =
      languageWords(query);

    if (!words.length) {
      return "";
    }

    const scores = {
      en: 0,
      es: 0,
      fr: 0,
      de: 0
    };

    for (const word of words) {
      for (
        const lang of [
          "en","es","fr","de"
        ]
      ) {
        if (
          ROUTE_LATIN_LANGUAGE_SIGNALS[
            lang
          ].has(word)
        ) {
          scores[lang]++;
        }
      }
    }

    const ranked =
      Object.entries(scores)
        .sort(
          (a, b) =>
            b[1] - a[1]
        );

    const [bestLang, bestScore] =
      ranked[0] || ["", 0];

    const secondScore =
      ranked[1]?.[1] || 0;

    return (
      bestScore > 0 &&
      bestScore > secondScore
    )
      ? bestLang
      : "";
  }

  function detectRouteLanguage(
    query,
    fallbackLang
  ){
    const q =
      String(query || "");

    if (/\p{Script=Cyrillic}/u.test(q)) {
      return "ru";
    }

    if (/\p{Script=Arabic}/u.test(q)) {
      return "ar";
    }

    if (/\p{Script=Devanagari}/u.test(q)) {
      return "hi";
    }

    if (/\p{Script=Han}/u.test(q)) {
      return "zh";
    }

    const routeLatin =
      detectRouteLatinLanguage(q);

    if (routeLatin) {
      return routeLatin;
    }

    const fallback =
      LANGS.includes(
        String(fallbackLang || "")
          .toLowerCase()
      )
        ? String(fallbackLang)
            .toLowerCase()
        : getPageLang();

    return detectLatinSearchLanguage(
      q,
      fallback
    );
  }

  window.__primadomDetectRouteLanguage =
    detectRouteLanguage;

  const PROJECT_PROJECTION_SCHEMA =
    "v3-3d5-emirate-1";

  async function loadProjectProjection(
    lang
  ){
    if (
      PROJECT_PROJECTION_CACHE.has(
        lang
      )
    ) {
      return PROJECT_PROJECTION_CACHE.get(
        lang
      );
    }

    if (
      PROJECT_LOAD_PROMISES.has(
        lang
      )
    ) {
      return PROJECT_LOAD_PROMISES.get(
        lang
      );
    }

    const promise = fetch(
      `/search/project-projections-v3/${lang}.json?v=${PROJECT_PROJECTION_SCHEMA}`,
      {
        cache: "no-cache"
      }
    )
      .then(response => {
        if (!response.ok) {
          throw new Error(
            `Projection ${lang}: HTTP ${response.status}`
          );
        }

        return response.json();
      })
      .then(payload => {
        if (
          payload?.language !== lang ||
          payload?.count !== 2571 ||
          !Array.isArray(
            payload?.projects
          ) ||
          payload.projects.length !== 2571
        ) {
          throw new Error(
            `Projection ${lang}: invalid contract`
          );
        }

        const machineEmirateRows =
          payload.projects.filter(
            project =>
              Object.prototype.hasOwnProperty.call(
                project,
                "machine_emirate"
              )
          ).length;

        if (machineEmirateRows !== 2571) {
          throw new Error(
            `Projection ${lang}: stale schema — machine_emirate ${machineEmirateRows}/2571`
          );
        }

        PROJECT_PROJECTION_CACHE.set(
          lang,
          payload
        );

        return payload;
      })
      .finally(() => {
        PROJECT_LOAD_PROMISES.delete(
          lang
        );
      });

    PROJECT_LOAD_PROMISES.set(
      lang,
      promise
    );

    return promise;
  }

  async function activateSearchLanguage(
    lang,
    expectedSequence = null
  ){
    const target =
      LANGS.includes(lang)
        ? lang
        : "en";

    if (
      PROJECT_DATA_LANG === target
    ) {
      ACTIVE_SEARCH_LANG = target;
      return true;
    }

    try {
      const payload =
        await loadProjectProjection(
          target
        );

      // A newer query was submitted while this projection
      // was loading. Keep the fetched payload in cache,
      // but NEVER commit stale global Search state.
      if (
        expectedSequence !== null &&
        expectedSequence !==
          SEARCH_APPLY_SEQUENCE
      ) {
        return false;
      }

      PROJECT_PROJECTION = payload;

      PROJECT_ROWS =
        payload.projects;

      PROJECT_BY_SLUG =
        buildProjectBySlug(
          PROJECT_ROWS
        );

      PROJECT_DATA_LANG =
        target;

      ACTIVE_SEARCH_LANG =
        target;

      rebuildProjectEntityIndexes();
      resetProjectCardShells();

      const root =
        getResultsRoot();

      if (root) {
        root.dataset.searchLanguage =
          target;
      }

      return true;

    } catch (error) {
      console.warn(
        "[Prima Search] language switch failed:",
        target,
        error
      );

      ACTIVE_SEARCH_LANG =
        PROJECT_DATA_LANG;

      return false;
    }
  }

  const RESULT_LIMIT = 100;
  const PRICE_TOLERANCE = 0.10;

  // --- normalizer (stopwords + synonyms) ---
  function buildNormalizer(dict, lang){
    const stop = new Set([
      ...(dict.stopwords?.en || []),
      ...(dict.stopwords?.[lang] || [])
    ].map(x => String(x).toLowerCase()));

    const map = new Map();

    function addBlock(block){
      if (!block) return;
      for (const canonical of Object.keys(block)) {
        map.set(canonical.toLowerCase(), canonical.toLowerCase());
        for (const v of block[canonical]) map.set(String(v).toLowerCase(), canonical.toLowerCase());
      }
    }

    addBlock(dict.synonyms?.global);
    addBlock(dict.synonyms?.[lang]);

    function tokenize(q){
      return String(q || "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s\-]/gu, " ")
        .replace(/\s+/g, " ")
        .trim()
        .split(" ")
        .filter(Boolean);
    }

    function normalize(q){
      const raw = tokenize(q);
      const filtered = raw.filter(tok => !stop.has(tok));

      // glue: "1 br" -> "1br"
      const glued = [];
      for (let i=0; i<filtered.length; i++){
        const a = filtered[i];
        const b = filtered[i+1];
        if (/^[0-9]$/.test(a) && (b === "br" || b === "bedroom" || b === "bedrooms")) {
          glued.push(a + "br");
          i++;
          continue;
        }
        glued.push(a);
      }

      return glued.map(tok => map.get(tok) || tok);
    }

    return { normalize };
  }

  // --- DOM helpers (do not change markup) ---
  function getResultsRoot(){ return document.getElementById("results"); }
  function getResultsInput(){ return document.getElementById("resultsQuery"); }

  function getCards(){
    const root = getResultsRoot();
    if (!root) return [];
    return Array.from(root.querySelectorAll('a.results-card'));
  }

  function extractSlugFromHref(href){
    try {
      const url = new URL(href, window.location.origin);
      const parts = url.pathname.split("/").filter(Boolean);
      const i = parts.indexOf("projects");
      if (i >= 0 && parts[i+1]) return parts[i+1];
      return parts[parts.length - 1] || "";
    } catch(e) {
      return "";
    }
  }

  // ---------------------------------------------------------
  // Search V2 — lightweight Project shells
  // ---------------------------------------------------------

  function projectionSearchText(p){
    const features = Array.isArray(p.features)
      ? p.features.map(x => String(x).replace(/-/g, " "))
      : [];

    return [
      p.search_terms || "",
      ...features
    ]
      .join(" ")
      .toLowerCase()
      .trim();
  }

  function createProjectCardShell(p){
    const a = document.createElement("a");

    a.className = "results-card";
    a.href = String(p.canonical_url || "");

    a.dataset.slug = String(p.slug || "");
    a.dataset.search = projectionSearchText(p);
    a.dataset.title = String(p.title || "");
    a.dataset.location = String(
      p.display_location ||
      p.district ||
      ""
    );
    a.dataset.developer = String(p.developer || "");
    a.dataset.price = String(p.price_display || "");

    a.dataset.priceAmount =
      p.price_amount === null ||
      typeof p.price_amount === "undefined"
        ? ""
        : String(p.price_amount);

    a.dataset.type = String(p.property_type || "");
    a.dataset.units = String(p.units || "");
    a.dataset.handover = String(p.handover || "");
    a.dataset.paymentPlan = String(p.payment_plan || "");
    a.dataset.status = String(p.status || "");
    a.dataset.size = String(p.size_from || "");

    // Stable machine facets for shared multilingual Search V2.
    a.dataset.machineDistrict = String(
      p.machine_district ||
      p.district ||
      ""
    );

    a.dataset.machineEmirate = String(
      p.machine_emirate ||
      ""
    );

    a.dataset.machineDeveloper = String(
      p.machine_developer ||
      p.developer ||
      ""
    );

    a.dataset.machineType = String(
      p.machine_property_type ||
      p.property_type ||
      ""
    );

    a.dataset.machineUnits = String(
      p.machine_units ||
      p.units ||
      ""
    );

    a.dataset.machineHandover = String(
      p.machine_handover ||
      p.handover ||
      ""
    );

    a.dataset.machinePaymentPlan = String(
      p.machine_payment_plan ||
      p.payment_plan ||
      ""
    );

    a.dataset.machineStatus = String(
      p.machine_status ||
      p.status ||
      ""
    );

    a.dataset.machineSize = String(
      p.machine_size_from ||
      p.size_from ||
      ""
    );

    a.dataset.hasImage = p.gallery_1 ? "1" : "0";
    a.dataset.hydrated = "0";

    a.style.display = "none";

    return a;
  }

  const CARD_LABELS_BY_LANG = {
    en: {
      location: "Location:",
      priceFrom: "Price From:"
    },

    ru: {
      location: "Локация:",
      priceFrom: "Цена от:"
    },

    hi: {
      location: "स्थान:",
      priceFrom: "कीमत से:"
    },

    zh: {
      location: "位置：",
      priceFrom: "起价："
    },

    es: {
      location: "Ubicación:",
      priceFrom: "Precio desde:"
    },

    fr: {
      location: "Localisation:",
      priceFrom: "Prix à partir de:"
    },

    de: {
      location: "Lage:",
      priceFrom: "Preis ab:"
    },

    ar: {
      location: "الموقع:",
      priceFrom: "السعر من:"
    }
  };

  function getCardLabels(){
    return (
      CARD_LABELS_BY_LANG[
        ACTIVE_SEARCH_LANG
      ] ||
      CARD_LABELS_BY_LANG.en
    );
  }

  function hydrateProjectCard(a){
    if (!a || a.dataset.hydrated === "1") return;

    const p = PROJECT_BY_SLUG.get(
      String(a.dataset.slug || "")
    );

    if (!p) return;

    const labels = getCardLabels();

    const inner = document.createElement("div");
    inner.className = "results-card__inner";

    if (p.gallery_1) {
      const img = document.createElement("img");

      img.className = "results-card__img";
      img.src = String(p.gallery_1);
      img.alt = String(p.image_alt || p.title || "");
      img.loading = "lazy";

      inner.appendChild(img);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "results-card__placeholder";

      inner.appendChild(placeholder);
    }

    const meta = document.createElement("div");
    meta.className = "results-card__meta";

    const title = document.createElement("h3");
    title.className = "results-card__title";
    title.textContent = String(p.title || p.slug || "");

    meta.appendChild(title);

    const location = String(
      p.display_location ||
      p.district ||
      ""
    ).trim();

    if (location) {
      const row = document.createElement("div");
      row.className = "results-card__row";

      const label = document.createElement("span");
      label.textContent = labels.location;

      const value = document.createElement("strong");
      value.textContent = location;

      row.appendChild(label);
      row.appendChild(value);
      meta.appendChild(row);
    }

    const priceDisplay = String(
      p.price_display || ""
    ).trim();

    if (priceDisplay) {
      const row = document.createElement("div");
      row.className = "results-card__row";

      const label = document.createElement("span");
      label.textContent = labels.priceFrom;

      const price = document.createElement("strong");
      price.className = "price";

      const value = document.createElement("span");
      value.className = "price__value";

      if (priceDisplay.startsWith("AED ")) {
        const currency = document.createElement("span");
        currency.className = "price__currency";
        currency.textContent = "AED";

        value.textContent = priceDisplay.replace(/^AED\s+/, "");

        price.appendChild(currency);
      } else {
        value.textContent = priceDisplay;
      }

      price.appendChild(value);

      row.appendChild(label);
      row.appendChild(price);
      meta.appendChild(row);
    }

    inner.appendChild(meta);
    a.appendChild(inner);

    a.dataset.hydrated = "1";
  }

  function ensureProjectCardShells(){
    const grid = rootGrid();

    if (!grid) return;

    if (getCards().length) return;

    const fragment =
      document.createDocumentFragment();

    for (const p of PROJECT_ROWS) {
      fragment.appendChild(
        createProjectCardShell(p)
      );
    }

    grid.appendChild(fragment);
  }

  function resetProjectCardShells(){
    const root =
      getResultsRoot();

    if (!root) return;

    for (
      const card of
      root.querySelectorAll(
        "a.results-card"
      )
    ) {
      card.remove();
    }
  }

  // ---------------------------------------------------------
  // Search V2 — safe commercial entity resolver
  // Projects remain the only visual Search result type.
  // ---------------------------------------------------------

  function entityText(value){
    return String(value || "")
      .toLowerCase()
      .replace(/[’']/g, "")
      .replace(/[^\p{L}\p{N}]+/gu, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function entityKey(value){
    return entityText(value).replace(/\s+/g, "");
  }

  function entityPhraseMatch(query, phrase){
    const q = entityText(query);
    const p = entityText(phrase);

    if (!q || !p) return false;

    return (` ${q} `).includes(` ${p} `);
  }

  function uniqueEntityNames(field){
    const seen = new Map();

    for (const p of PROJECT_ROWS) {
      const raw = String(p?.[field] || "").trim();
      if (!raw) continue;

      const key = entityText(raw);
      if (!key) continue;

      if (!seen.has(key)) {
        seen.set(key, raw);
      }
    }

    return Array.from(seen.values())
      .sort((a, b) =>
        entityText(b).length - entityText(a).length
      );
  }

  let PROJECT_DEVELOPER_NAMES =
    uniqueEntityNames("developer");

  let PROJECT_DISTRICT_NAMES =
    uniqueEntityNames("district");

  function rebuildProjectEntityIndexes(){
    PROJECT_DEVELOPER_NAMES =
      uniqueEntityNames(
        "developer"
      );

    PROJECT_DISTRICT_NAMES =
      uniqueEntityNames(
        "district"
      );
  }

  // Small verified shorthand layer only.
  // No blind fuzzy matching and no legacy area_aliases.json.
  const VERIFIED_DEVELOPER_ALIASES = new Map([
    ["emaar", "Emaar Properties"]
  ]);

  const VERIFIED_DISTRICT_ALIASES = new Map([
    ["dubai hills", "Dubai Hills Estate"],
    ["citywalk", "City Walk"]
  ]);

  function resolveNamedEntity(query, names, aliases){
    const q = entityText(query);

    if (!q) return null;

    const aliasEntries = Array.from(aliases.entries())
      .sort((a, b) => b[0].length - a[0].length);

    for (const [alias, canonical] of aliasEntries) {
      if (entityPhraseMatch(q, alias)) {
        return canonical;
      }
    }

    for (const name of names) {
      if (entityPhraseMatch(q, name)) {
        return name;
      }
    }

    return null;
  }

  function canonicalizeRelationQuery(
    value,
    lang
  ){
    let q = normalizeSearchDigits(value)
      .normalize("NFKC")
      .replace(
        /[\u064B-\u065F\u0670\u06D6-\u06ED]/g,
        ""
      )
      .replace(/[،؛]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    if (!q) {
      return "";
    }


    // -------------------------------------------------------
    // RU
    // -------------------------------------------------------
    if (lang === "ru") {
      q = q
        .replace(
          /(?:похожие|похожий|похожая|похожее|подобные|аналогичные)\s+(?:на|к)\s+/giu,
          "similar to "
        )
        .replace(
          /дешевле\s+чем\s+/giu,
          "cheaper than "
        )
        .replace(
          /(?:в\s+том\s+же|тот\s+же)\s+(?:районе|район|локации|локация)\s+(?:что|как)\s+/giu,
          "same district as "
        )
        .replace(
          /(?:у\s+того\s+же|тот\s+же)\s+застройщик(?:а)?\s+(?:что|как)\s+/giu,
          "same developer as "
        )
        .replace(
          /(?:сдача|передача)\s+раньше\s+чем\s+/giu,
          "earlier handover than "
        )
        .replace(
          /\s+но\s+/giu,
          " but "
        )
        .replace(
          /в\s+другом\s+(?:районе|локации)/giu,
          "in another district"
        )
        .replace(
          /от\s+другого\s+застройщика/giu,
          "by another developer"
        )
        .replace(
          /дешевле/giu,
          "cheaper"
        );
    }


    // -------------------------------------------------------
    // AR
    // -------------------------------------------------------
    if (lang === "ar") {
      q = q
        .replace(
          /(?:مشاريع?\s+)?مشابه(?:ة)?\s+(?:لـ|ل)\s*/gu,
          "similar to "
        )
        .replace(
          /(?:أرخص|ارخص)\s+من\s+/gu,
          "cheaper than "
        )
        .replace(
          /نفس\s+(?:المنطقة|الحي)\s+مثل\s+/gu,
          "same district as "
        )
        .replace(
          /نفس\s+(?:المطور|شركة\s+التطوير)\s+مثل\s+/gu,
          "same developer as "
        )
        .replace(
          /تسليم\s+(?:أبكر|ابكر)\s+من\s+/gu,
          "earlier handover than "
        )
        .replace(
          /\s+(?:ولكن|لكن)\s+/gu,
          " but "
        )
        .replace(
          /في\s+منطقة\s+(?:أخرى|اخرى)/gu,
          "in another district"
        )
        .replace(
          /من\s+مطور\s+(?:آخر|اخر)/gu,
          "by another developer"
        )
        .replace(
          /(?:أرخص|ارخص)/gu,
          "cheaper"
        );
    }


    // -------------------------------------------------------
    // HI
    // -------------------------------------------------------
    if (lang === "hi") {
      // Specific anchor-first relations first.
      q = q.replace(
        /^(.+?)\s+के\s+समान\s+(?:इलाके|क्षेत्र)\s+में/u,
        "same district as $1"
      );

      q = q.replace(
        /^(.+?)\s+के\s+समान\s+(?:डेवलपर|बिल्डर)\s+से/u,
        "same developer as $1"
      );

      q = q.replace(
        /^(.+?)\s+से\s+(?:सस्ता|सस्ते)/u,
        "cheaper than $1"
      );

      q = q.replace(
        /^(.+?)\s+से\s+पहले\s+(?:हैंडओवर|डिलीवरी)/u,
        "earlier handover than $1"
      );

      // "Passo जैसे प्रोजेक्ट" → "projects like Passo"
      q = q.replace(
        /^(.+?)\s+जैसे\s+(?:प्रोजेक्ट|प्रोजेक्ट्स|परियोजना|परियोजनाएं)/u,
        "projects like $1"
      );

      // Generic similarity only after specific relations.
      q = q.replace(
        /^(.+?)\s+के\s+समान/u,
        "similar to $1"
      );

      q = q
        .replace(
          /\s+लेकिन\s+/gu,
          " but "
        )
        .replace(
          /\s+परंतु\s+/gu,
          " but "
        )
        .replace(
          /दूसरे\s+(?:इलाके|क्षेत्र)\s+में/gu,
          "in another district"
        )
        .replace(
          /दूसरे\s+(?:डेवलपर|बिल्डर)\s+से/gu,
          "by another developer"
        )
        .replace(
          /(?:सस्ता|सस्ते)/gu,
          "cheaper"
        );
    }


    // -------------------------------------------------------
    // ZH
    // -------------------------------------------------------
    if (lang === "zh") {
      // More specific forms first.
      q = q.replace(
        /^与?\s*(.+?)\s*(?:同一地区|同一区域|同一片区)/u,
        "same district as $1"
      );

      q = q.replace(
        /^与?\s*(.+?)\s*(?:同一开发商|同一个开发商)/u,
        "same developer as $1"
      );

      q = q.replace(
        /^与?\s*(.+?)\s*类似/u,
        "similar to $1 "
      );

      q = q.replace(
        /比\s*(.+?)\s*(?:更早交付|更早完工|更早移交)/u,
        "earlier handover than $1"
      );

      q = q
        .replace(
          /比\s*(.+?)\s*便宜/u,
          "cheaper than $1"
        )
        .replace(
          /但(?:是)?/gu,
          " but "
        )
        .replace(
          /更便宜/gu,
          "cheaper"
        )
        .replace(
          /在(?:另一个|其他)(?:地区|区域|片区)/gu,
          "in another district"
        )
        .replace(
          /由(?:另一个|其他)开发商/gu,
          "by another developer"
        );
    }


    // -------------------------------------------------------
    // ES
    // -------------------------------------------------------
    if (lang === "es") {
      q = q
        .replace(
          /similares?\s+a\s+/giu,
          "similar to "
        )
        .replace(
          /más\s+barat[oa]s?\s+que\s+/giu,
          "cheaper than "
        )
        .replace(
          /mas\s+barat[oa]s?\s+que\s+/giu,
          "cheaper than "
        )
        .replace(
          /mism[oa]\s+(?:distrito|zona)\s+que\s+/giu,
          "same district as "
        )
        .replace(
          /mism[oa]\s+(?:promotor|desarrollador)\s+que\s+/giu,
          "same developer as "
        )
        .replace(
          /entrega\s+antes\s+que\s+/giu,
          "earlier handover than "
        )
        .replace(
          /\s+pero\s+/giu,
          " but "
        )
        .replace(
          /en\s+otr[oa]\s+(?:distrito|zona)/giu,
          "in another district"
        )
        .replace(
          /de\s+otr[oa]\s+(?:promotor|desarrollador)/giu,
          "by another developer"
        )
        .replace(
          /(?:más|mas)\s+barat[oa]s?/giu,
          "cheaper"
        );
    }


    // -------------------------------------------------------
    // FR
    // -------------------------------------------------------
    if (lang === "fr") {
      q = q
        .replace(
          /similaires?\s+(?:à|a)\s+/giu,
          "similar to "
        )
        .replace(
          /moins\s+ch(?:er|ère|ers|ères)\s+que\s+/giu,
          "cheaper than "
        )
        .replace(
          /même\s+(?:quartier|zone)\s+que\s+/giu,
          "same district as "
        )
        .replace(
          /même\s+(?:promoteur|développeur)\s+que\s+/giu,
          "same developer as "
        )
        .replace(
          /livraison\s+plus\s+tôt\s+que\s+/giu,
          "earlier handover than "
        )
        .replace(
          /\s+mais\s+/giu,
          " but "
        )
        .replace(
          /dans\s+un(?:e)?\s+autre\s+(?:quartier|zone)/giu,
          "in another district"
        )
        .replace(
          /par\s+un(?:e)?\s+autre\s+(?:promoteur|développeur)/giu,
          "by another developer"
        )
        .replace(
          /moins\s+ch(?:er|ère|ers|ères)/giu,
          "cheaper"
        );
    }


    // -------------------------------------------------------
    // DE
    // -------------------------------------------------------
    if (lang === "de") {
      q = q
        .replace(
          /(?:ähnlich|aehnlich)\s+wie\s+/giu,
          "similar to "
        )
        .replace(
          /(?:günstiger|guenstiger)\s+als\s+/giu,
          "cheaper than "
        )
        .replace(
          /gleich(?:er|e|es)\s+(?:bezirk|gebiet)\s+wie\s+/giu,
          "same district as "
        )
        .replace(
          /gleich(?:er|e|es)\s+(?:bauträger|bautraeger|entwickler)\s+wie\s+/giu,
          "same developer as "
        )
        .replace(
          /frühere?\s+(?:übergabe|uebergabe)\s+als\s+/giu,
          "earlier handover than "
        )
        .replace(
          /\s+aber\s+/giu,
          " but "
        )
        .replace(
          /in\s+ein(?:em|er)\s+anderen\s+(?:bezirk|gebiet)/giu,
          "in another district"
        )
        .replace(
          /von\s+ein(?:em|er)\s+anderen\s+(?:bauträger|bautraeger|entwickler)/giu,
          "by another developer"
        )
        .replace(
          /(?:günstiger|guenstiger)/giu,
          "cheaper"
        );
    }


    // Budget modifiers after relation anchor must be transformed
    // before splitRelationAnchorModifier(), e.g.
    //
    // "similares a Passo menos de 5 millones"
    // → "similar to Passo under 5 million"
    q = canonicalizeBudgetLanguage(
      q,
      lang
    );

    return q
      .replace(/\s+/g, " ")
      .trim();
  }


  function splitRelationAnchorModifier(value){
    const text = String(value || "")
      .replace(/\s+/g, " ")
      .trim();

    if (!text) {
      return {
        anchorText: "",
        modifierText: ""
      };
    }

    // Explicit conversational separator:
    // "Passo but cheaper"
    // "Passo but in another district"
    let m = text.match(
      /^(.*?)\s+\bbut\b\s+(.+)$/i
    );

    if (m && m[1] && m[2]) {
      return {
        anchorText: m[1].trim(),
        modifierText: m[2].trim()
      };
    }

    // Comma-separated modifier:
    // "Passo, 2 bedrooms"
    m = text.match(
      /^(.*?),\s*(.+)$/
    );

    if (m && m[1] && m[2]) {
      return {
        anchorText: m[1].trim(),
        modifierText: m[2].trim()
      };
    }

    // Modifier without "but":
    // "Passo under AED 5M"
    // Only split on strong, known filter language.
    m = text.match(
      /^(.*?)\s+((?:under|below|up to|over|above|from|at least|around|about|approximately|approx|roughly|budget)\b.+)$/i
    );

    if (m && m[1] && m[2]) {
      return {
        anchorText: m[1].trim(),
        modifierText: m[2].trim()
      };
    }

    return {
      anchorText: text,
      modifierText: ""
    };
  }

  function extractRelationIntent(query){
    const q = String(query || "").trim();

    // Anchor-first conversational relations:
    //
    // "Passo but in another district"
    // "Passo but by another developer"
    // "Passo but cheaper"
    const anchorFirstRules = [
      {
        re: /^(.+?)\s+\bbut\b\s+((?:in\s+)?another\s+(?:district|area)\b.*)$/i
      },
      {
        re: /^(.+?)\s+\bbut\b\s+((?:(?:by|from)\s+)?another\s+developer\b.*)$/i
      },
      {
        re: /^(.+?)\s+\bbut\b\s+(cheaper\b.*)$/i
      }
    ];

    for (const rule of anchorFirstRules) {
      const m = q.match(rule.re);

      if (m && m[1] && m[2]) {
        return {
          type: "similar",
          anchorText: m[1].trim(),
          modifierText: m[2].trim()
        };
      }
    }

    const rules = [
      {
        type: "same-district",
        re: /\bsame\s+(?:district|area)\s+as\s+(.+)$/i
      },
      {
        type: "same-developer",
        re: /\bsame\s+developer\s+as\s+(.+)$/i
      },
      {
        type: "earlier-handover",
        re: /\bearlier\s+handover\s+than\s+(.+)$/i
      },
      {
        type: "cheaper",
        re: /\bcheaper\s+than\s+(.+)$/i
      },
      {
        type: "similar",
        re: /\bsimilar\s+to\s+(.+)$/i
      },
      {
        type: "similar",
        re: /\balternatives?\s+to\s+(.+)$/i
      },
      {
        type: "similar",
        re: /^\s*(?:projects?\s+)?like\s+(.+)$/i
      }
    ];

    for (const rule of rules) {
      const m = q.match(rule.re);

      if (m && m[1]) {
        const parts = splitRelationAnchorModifier(
          m[1]
        );

        return {
          type: rule.type,
          anchorText: parts.anchorText,
          modifierText: parts.modifierText
        };
      }
    }

    return null;
  }

  function resolveProjectAnchor(anchorText){
    const q = entityText(anchorText);

    if (!q) return null;

    // Exact project title first.
    for (const p of PROJECT_ROWS) {
      if (
        p?.title &&
        entityText(p.title) === q
      ) {
        return p;
      }
    }

    // Then longest whole-phrase match inside the extracted anchor only.
    // This avoids false positives such as Elo inside "developer"
    // or District inside "same district as Passo".
    const candidates = PROJECT_ROWS
      .filter(p =>
        p?.title &&
        entityPhraseMatch(q, p.title)
      )
      .sort((a, b) =>
        entityText(b.title).length -
        entityText(a.title).length
      );

    return candidates[0] || null;
  }

  function resolveSearchEntities(query){
    const relationQuery =
      canonicalizeRelationQuery(
        query,
        getLang()
      );

    const relation =
      extractRelationIntent(
        relationQuery
      );

    const anchor = relation
      ? resolveProjectAnchor(relation.anchorText)
      : null;

    return {
      developer: relation
        ? null
        : resolveNamedEntity(
            query,
            PROJECT_DEVELOPER_NAMES,
            VERIFIED_DEVELOPER_ALIASES
          ),

      district: relation
        ? null
        : resolveNamedEntity(
            query,
            PROJECT_DISTRICT_NAMES,
            VERIFIED_DISTRICT_ALIASES
          ),

      relation,
      anchor
    };
  }

  // ---------------------------------------------------------
  // Search V2 — Project Relation Engine
  // ---------------------------------------------------------

  function projectHandoverYear(value){
    const m = String(value || "").match(
      /\b(20(?:2[0-9]|3[0-9]))\b/
    );

    return m ? Number(m[1]) : 0;
  }

  function machineDistrictOf(p){
    return String(
      p?.machine_district ||
      p?.district ||
      ""
    );
  }

  function machineDeveloperOf(p){
    return String(
      p?.machine_developer ||
      p?.developer ||
      ""
    );
  }

  function machineTypeOf(p){
    return String(
      p?.machine_property_type ||
      p?.property_type ||
      ""
    );
  }

  function machineHandoverOf(p){
    return String(
      p?.machine_handover ||
      p?.handover ||
      ""
    );
  }

  const CROSS_RELATION_TYPES = new Set([
    "studio",
    "apartment",
    "villa",
    "penthouse",
    "townhouse",
    "duplex"
  ]);

  function crossRelationTypeSet(value){
    const q = entityText(value);
    const out = new Set();

    for (const type of CROSS_RELATION_TYPES) {
      if (
        (` ${q} `).includes(` ${type} `)
      ) {
        out.add(type);
      }
    }

    return out;
  }

  function crossRelationFeatureSet(project){
    return new Set(
      Array.isArray(project?.features)
        ? project.features
            .map(x => String(x).toLowerCase())
            .filter(Boolean)
        : []
    );
  }

  function setOverlapCount(a, b){
    let count = 0;

    for (const value of a) {
      if (b.has(value)) count++;
    }

    return count;
  }

  function crossEntityRelationMetrics(data, entities){
    const anchor = entities?.anchor;

    if (!anchor || !data?.slug) {
      return null;
    }

    const candidate = PROJECT_BY_SLUG.get(
      String(data.slug)
    );

    if (!candidate) {
      return null;
    }

    const anchorTypes = crossRelationTypeSet(
      machineTypeOf(anchor)
    );

    const candidateTypes = crossRelationTypeSet(
      machineTypeOf(candidate)
    );

    const anchorFeatures =
      crossRelationFeatureSet(anchor);

    const candidateFeatures =
      crossRelationFeatureSet(candidate);

    const typeOverlap = setOverlapCount(
      anchorTypes,
      candidateTypes
    );

    const featureOverlap = setOverlapCount(
      anchorFeatures,
      candidateFeatures
    );

    const explicit = new Set(
      Array.isArray(anchor.similar_projects)
        ? anchor.similar_projects.map(String)
        : []
    ).has(String(candidate.slug));

    const anchorDistrict =
      machineDistrictOf(anchor);

    const candidateDistrict =
      machineDistrictOf(candidate);

    const anchorDeveloper =
      machineDeveloperOf(anchor);

    const candidateDeveloper =
      machineDeveloperOf(candidate);

    const sameDistrict = !!(
      anchorDistrict &&
      candidateDistrict &&
      entityKey(anchorDistrict) ===
        entityKey(candidateDistrict)
    );

    const sameDeveloper = !!(
      anchorDeveloper &&
      candidateDeveloper &&
      entityKey(anchorDeveloper) ===
        entityKey(candidateDeveloper)
    );

    let score = 0;

    if (explicit) {
      score += 5000;
    }

    score += typeOverlap * 220;
    score += featureOverlap * 90;

    if (sameDeveloper) {
      score += 180;
    }

    if (sameDistrict) {
      score += 180;
    }

    const anchorPrice = Number(
      anchor.price_amount || 0
    );

    const candidatePrice = Number(
      candidate.price_amount || 0
    );

    if (
      anchorPrice > 0 &&
      candidatePrice > 0
    ) {
      const ratio =
        Math.abs(
          candidatePrice - anchorPrice
        ) / anchorPrice;

      score += Math.max(
        0,
        140 - Math.round(ratio * 140)
      );
    }

    const anchorYear =
      projectHandoverYear(
        machineHandoverOf(anchor)
      );

    const candidateYear =
      projectHandoverYear(
        machineHandoverOf(candidate)
      );

    if (anchorYear && candidateYear) {
      score += Math.max(
        0,
        60 - Math.abs(
          anchorYear - candidateYear
        ) * 10
      );
    }

    const strong =
      typeOverlap >= 2 &&
      featureOverlap >= 2 &&
      score >= 750;

    return {
      candidate,
      score,
      typeOverlap,
      featureOverlap,
      explicit,
      sameDistrict,
      sameDeveloper,
      strong
    };
  }

  function crossEntityCandidatePass(
    data,
    entities,
    anotherDistrict,
    anotherDeveloper
  ){
    const m = crossEntityRelationMetrics(
      data,
      entities
    );

    if (!m) return false;

    const anchor = entities.anchor;
    const candidate = m.candidate;

    if (candidate.slug === anchor.slug) {
      return false;
    }

    if (anotherDistrict) {
      // Unknown district is NOT "another district".
      if (!machineDistrictOf(candidate)) {
        return false;
      }

      if (m.sameDistrict) {
        return false;
      }

      return m.strong;
    }

    if (anotherDeveloper) {
      // Unknown developer is NOT "another developer".
      if (!machineDeveloperOf(candidate)) {
        return false;
      }

      if (m.sameDeveloper) {
        return false;
      }

      // Canonical explicit graph is always trusted here.
      return m.explicit || m.strong;
    }

    return false;
  }

  function relationCandidatePass(data, entities){
    if (!entities?.relation || !entities?.anchor) {
      return true;
    }

    const relation = entities.relation.type;
    const anchor = entities.anchor;

    if (!data.slug) return false;

    // Never return the anchor itself.
    if (data.slug === String(anchor.slug || "")) {
      return false;
    }

    const similar = new Set(
      Array.isArray(anchor.similar_projects)
        ? anchor.similar_projects.map(String)
        : []
    );

    if (relation === "similar") {
      // Canonical explicit graph first.
      if (similar.size) {
        return similar.has(data.slug);
      }

      // Safe fallback only if graph is absent.
      const anchorDistrict =
        machineDistrictOf(anchor);

      const anchorDeveloper =
        machineDeveloperOf(anchor);

      const sameDistrict =
        anchorDistrict &&
        entityKey(data.machineDistrict) ===
          entityKey(anchorDistrict);

      const sameDeveloper =
        anchorDeveloper &&
        entityKey(data.machineDeveloper) ===
          entityKey(anchorDeveloper);

      return !!(sameDistrict || sameDeveloper);
    }

    if (relation === "cheaper") {
      const anchorPrice = Number(anchor.price_amount || 0);

      return !!(
        anchorPrice > 0 &&
        data.price > 0 &&
        data.price < anchorPrice
      );
    }

    if (relation === "same-district") {
      const anchorDistrict =
        machineDistrictOf(anchor);

      return !!(
        anchorDistrict &&
        entityKey(data.machineDistrict) ===
          entityKey(anchorDistrict)
      );
    }

    if (relation === "same-developer") {
      const anchorDeveloper =
        machineDeveloperOf(anchor);

      return !!(
        anchorDeveloper &&
        entityKey(data.machineDeveloper) ===
          entityKey(anchorDeveloper)
      );
    }

    if (relation === "earlier-handover") {
      const anchorYear =
        projectHandoverYear(
          machineHandoverOf(anchor)
        );

      const candidateYear =
        projectHandoverYear(data.handover);

      return !!(
        anchorYear &&
        candidateYear &&
        candidateYear < anchorYear
      );
    }

    return true;
  }

  function relationCandidateScore(data, entities){
    if (!entities?.relation || !entities?.anchor) {
      return 0;
    }

    const anchor = entities.anchor;

    const similar = new Set(
      Array.isArray(anchor.similar_projects)
        ? anchor.similar_projects.map(String)
        : []
    );

    let score = 0;

    // Explicit canonical relation is the strongest signal.
    if (similar.has(data.slug)) {
      score += 5000;
    }

    const anchorDistrict =
      machineDistrictOf(anchor);

    const anchorDeveloper =
      machineDeveloperOf(anchor);

    if (
      anchorDistrict &&
      entityKey(data.machineDistrict) ===
        entityKey(anchorDistrict)
    ) {
      score += 240;
    }

    if (
      anchorDeveloper &&
      entityKey(data.machineDeveloper) ===
        entityKey(anchorDeveloper)
    ) {
      score += 200;
    }

    // Prefer commercially closer price alternatives.
    const anchorPrice = Number(anchor.price_amount || 0);

    if (anchorPrice > 0 && data.price > 0) {
      const ratio =
        Math.abs(data.price - anchorPrice) / anchorPrice;

      score += Math.max(
        0,
        120 - Math.round(ratio * 120)
      );
    }

      projectHandoverYear(
        machineHandoverOf(anchor)
      );

    const candidateYear =
      projectHandoverYear(
        data.handover
      );

    if (anchorYear && candidateYear) {
      const gap = Math.abs(anchorYear - candidateYear);

      score += Math.max(
        0,
        50 - gap * 10
      );
    }

    return score;
  }

  function detectEmiratesFromTokens(tokens){
    const out = new Set();

    for (const t of tokens) {
      const c = canonEmirateFromText(t);
      if (c) out.add(c);
    }

    for (let i=0; i<tokens.length-1; i++){
      const bi = (tokens[i] + " " + tokens[i+1]).trim();
      const c = canonEmirateFromText(bi);
      if (c) out.add(c);
    }

    for (let i=0; i<tokens.length-2; i++){
      const tri = (tokens[i] + " " + tokens[i+1] + " " + tokens[i+2]).trim();
      const c = canonEmirateFromText(tri);
      if (c) out.add(c);

  function projectHasEmirate(p, canon){
    if (!p || !canon) return false;

    const direct = (p.emirate || p._emirate || "").toString().toLowerCase();
    if (direct) {
      const d = direct.replace(/\s+/g,"-");
      if (d === canon) return true;
    }

    const ptokens = Array.isArray(p.tokens) ? p.tokens.map(x => String(x).toLowerCase()) : [];

    const c1 = canon;
    const c2 = canon.replace(/-/g, " ");
    const c3 = canon.replace(/-/g, "");
    const c4 = canon.replace(/-/g, "_");

    return ptokens.includes(c1) || ptokens.includes(c2) || ptokens.includes(c3) || ptokens.includes(c4);

  function normalizeSearchDigits(value){
    const maps = [
      ["٠١٢٣٤٥٦٧٨٩", "0123456789"],
      ["۰۱۲۳۴۵۶۷۸۹", "0123456789"],
      ["०१२३४५६७८९", "0123456789"],
      ["０１２３４５６７８９", "0123456789"]
    ];

    let out = String(value || "");

    for (const [from, to] of maps) {
      for (let i = 0; i < from.length; i++) {
        out = out.split(from[i]).join(to[i]);
      }
    }

    return out;
  }


  function replaceSearchAliases(text, aliases){
    const pairs = [];

    for (const [canonical, values] of aliases) {
      for (const value of values) {
        pairs.push([
          String(value).toLowerCase(),
          canonical
        ]);
      }
    }

    // Longest phrases first:
    // "maison de ville" before "villa", etc.
    pairs.sort((a, b) =>
      b[0].length - a[0].length
    );

    let out = text;

    for (const [from, to] of pairs) {
      out = out.split(from).join(
        ` ${to} `
      );
    }

    return out;
  }

  function escapeSearchRegex(value){
    return String(value || "")
      .replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );
  }


  function replaceSearchScaleAliases(
    text,
    aliases
  ){
    const pairs = [];

    for (
      const [canonical, values]
      of aliases
    ) {
      for (const value of values) {
        pairs.push([
          String(value).toLowerCase(),
          canonical
        ]);
      }
    }

    // Longest first.
    pairs.sort(
      (a, b) =>
        b[0].length - a[0].length
    );

    let out = String(text || "");

    for (const [from, to] of pairs) {
      const pattern =
        escapeSearchRegex(from)
          .replace(
            /\s+/g,
            "\\s+"
          );

      const re = new RegExp(
        `(^|[^\\p{L}])${pattern}(?=$|[^\\p{L}])`,
        "giu"
      );

      out = out.replace(
        re,
        (_, lead) =>
          `${lead} ${to} `
      );
    }

    return out;
  }


  function canonicalizeBudgetLanguage(text, lang){
    let q = text;

    const scaleAliases = [
      ["million", [
        "миллионов", "миллиона", "миллион", "млн",
        "مليون",
        "मिलियन",
        "百万",
        "millones", "millón", "millon",
        "millions",
        "millionen"
      ]],
      ["thousand", [
        "тысяч", "тысячи", "тыс",
        "ألف", "الف",
        "हजार",
        "千",
        "miles", "mil",
        "milliers", "mille",
        "tausend"
      ]],
      ["aed", [
        "дирхамов", "дирхам", "аед",
        "درهم إماراتي", "درهم",
        "दिरहम", "धिरहम",
        "迪拉姆",
        "aed"
      ]]
    ];

    q = replaceSearchScaleAliases(
      q,
      scaleAliases
    );

    // Chinese "500万" → 5000000
    if (lang === "zh") {
      q = q.replace(
        /(\d+(?:\.\d+)?)\s*万/g,
        (_, value) =>
          String(
            Math.round(
              Number(value) * 10000
            )
          )
      );
    }

    const amountLookahead =
      String.raw`(?=(?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k|aed)\b|(?:aed\s*)?\d{5,}\b)`;

    const prefixRules = {
      ru: [
        ["under", "(?:не более|меньше|ниже|до)"],
        ["over", "(?:не менее|больше|выше|свыше|от)"],
        ["around", "(?:около|примерно|приблизительно)"]
      ],

      ar: [
        ["under", "(?:أقل من|اقل من|حتى|بحد أقصى|بحد اقصى)"],
        ["over", "(?:أكثر من|اكثر من|فوق|ابتداء من)"],
        ["around", "(?:حوالي|نحو|تقريبا|تقريباً)"]
      ],

      es: [
        ["under", "(?:menos de|hasta|como máximo|como maximo)"],
        ["over", "(?:más de|mas de|a partir de|mínimo|minimo)"],
        ["around", "(?:alrededor de|aproximadamente|unos|unas)"]
      ],

      fr: [
        ["under", "(?:moins de|jusqu'à|jusqu’a|maximum)"],
        ["over", "(?:plus de|à partir de|a partir de|minimum)"],
        ["around", "(?:environ|approximativement|autour de)"]
      ],

      de: [
        ["under", "(?:unter|bis|maximal|höchstens|hoechstens)"],
        ["over", "(?:über|uber|ab|mindestens)"],
        ["around", "(?:etwa|rund|ungefähr|ungefahr|circa)"]
      ]
    };

    for (const [to, pattern] of (
      prefixRules[lang] || []
    )) {
      q = q.replace(
        new RegExp(
          `${pattern}\\s+${amountLookahead}`,
          "giu"
        ),
        `${to} `
      );
    }

    // Hindi commonly places comparison AFTER amount.
    if (lang === "hi") {
      q = q.replace(
        /((?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k)(?:\s*aed)?|(?:aed\s*)?\d{5,}(?:\s*aed)?|(?:aed\s*)?\d+(?:\.\d+)?\s*aed)\s*(?:से कम|तक|के अंदर|अधिकतम)/giu,
        "under $1"
      );

      q = q.replace(
        /((?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k)(?:\s*aed)?|(?:aed\s*)?\d{5,}(?:\s*aed)?|(?:aed\s*)?\d+(?:\.\d+)?\s*aed)\s*(?:से ज्यादा|से अधिक|से ऊपर)/giu,
        "over $1"
      );

      q = q.replace(
        /(?:लगभग|करीब)\s*((?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k)(?:\s*aed)?|(?:aed\s*)?\d{5,}(?:\s*aed)?|(?:aed\s*)?\d+(?:\.\d+)?\s*aed)/giu,
        "around $1"
      );
    }

    // Chinese commonly places comparison AFTER amount.
    if (lang === "zh") {
      q = q.replace(
        /((?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k|aed)?|(?:aed\s*)?\d{5,})\s*(?:以下|以内|不超过)/gu,
        "under $1"
      );

      q = q.replace(
        /((?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k|aed)?|(?:aed\s*)?\d{5,})\s*(?:以上|起)/gu,
        "over $1"
      );

      q = q.replace(
        /(?:大约|约|左右)\s*((?:aed\s*)?\d+(?:\.\d+)?\s*(?:million|thousand|m|k|aed)?|(?:aed\s*)?\d{5,})/gu,
        "around $1"
      );
    }

    return q;
  }


  function canonicalizeSearchParserQuery(
    value,
    lang
  ){
    let q = normalizeSearchDigits(value)
      .normalize("NFKC")
      .toLowerCase()
      .replace(
        /[\u064B-\u065F\u0670\u06D6-\u06ED]/g,
        ""
      )
      .replace(/[،؛]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    q = canonicalizeBudgetLanguage(
      q,
      lang
    );

    q = replaceSearchAliases(
      q,
      SEARCH_CANON_ALIASES[lang] || []
    );

    // Numeric bedroom forms.
    const bedroomPatterns = {
      ru: /([0-9])\s*(?:спальня|спальни|спален)\b/gu,
      ar: /([0-9])\s*(?:غرف|غرفة)\s*(?:نوم)?/gu,
      hi: /([0-9])\s*(?:बेडरूम|बीआर)/gu,
      zh: /([0-9])\s*(?:卧室|室|居室|居)/gu,
      es: /([0-9])\s*(?:dormitorio|dormitorios|habitacion|habitación|habitaciones)\b/giu,
      fr: /([0-9])\s*(?:chambre|chambres)\b/giu,
      de: /([0-9])\s*(?:schlafzimmer)\b/giu
    };

    const bedroomPattern =
      bedroomPatterns[lang];

    if (bedroomPattern) {
      q = q.replace(
        bedroomPattern,
        "$1 bedrooms"
      );
    }

    return q
      .replace(/\s+/g, " ")
      .trim();
  }


  function splitQueryToParts(q, lang){
    const normalizer = buildNormalizer(DICT, lang);
    const tokens = normalizer.normalize(q).map(x => String(x).toLowerCase());

    const emirsFromWhole = canonEmirateFromText(q) ? [canonEmirateFromText(q)] : [];
    const emirsFromTokens = detectEmiratesFromTokens(tokens);

    const fromBullets = String(q || "")
      .split(/[\u00B7•,|/]+/g)
      .map(s => s.trim())
      .filter(Boolean)
      .map(s => canonEmirateFromText(s))
      .filter(Boolean);

    const emiratesWanted = Array.from(new Set([...emirsFromWhole, ...emirsFromTokens, ...fromBullets]))
      .filter(e => EMIRATE_SET.has(e));

    const nonEmirTokens = tokens.filter(t => !EMIRATE_SET.has(t));

    const strong = nonEmirTokens.filter(t => STRONG_TOKEN_SET.has(t));
    const weak   = nonEmirTokens.filter(t => !STRONG_TOKEN_SET.has(t));

    return { emiratesWanted, strong, weak, tokens };
  }

  const SEARCH_NOISE = new Set([
    "show","find","looking","look","want","need","please",
    "project","projects","property","properties","home","homes",
    "something","anything","preferably","prefer","maybe","would",
    "like","interested","search","searching","around","about",

  function normalText(v){
    return String(v || "")
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s\-]/gu, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function cardData(a){
    let price = Number(
      String(a.dataset.priceAmount || "").replace(/,/g, "")
    );

    if (!Number.isFinite(price) || price <= 0) {
      const txt = String(a.dataset.price || "")
        .toLowerCase()
        .replace(/,/g, "");

      const m = txt.match(/(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?/);

      if (m) {
        price = Number(m[1]);

        if (m[2] === "m" || m[2] === "million") {
          price *= 1000000;
        }

        if (m[2] === "k" || m[2] === "thousand") {
          price *= 1000;
        }
      }
    }

    return {
      card: a,
      slug: String(a.dataset.slug || extractSlugFromHref(a.href) || ""),
      title: normalText(a.dataset.title),
      location: normalText(a.dataset.location),
      developer: normalText(a.dataset.developer),

      machineDistrict: normalText(
        a.dataset.machineDistrict ||
        a.dataset.location
      ),

      machineEmirate: normalText(
        a.dataset.machineEmirate ||
        ""
      ),

      machineDeveloper: normalText(
        a.dataset.machineDeveloper ||
        a.dataset.developer
      ),

      type: normalText(

      search: normalText(a.dataset.search),
      hasImage: a.dataset.hasImage === "1",
      price: Number.isFinite(price) && price > 0 ? price : 0
    };
  }

  // ---------------------------------------------------------
  // Bedrooms

  const BED_WORDS = {
    zero: "0",
    one: "1",
    two: "2",
    three: "3",
    four: "4",
    five: "5",
    six: "6",
    seven: "7",
    eight: "8",
    nine: "9"
  };

  function detectBedrooms(query){
    let q = normalText(query);
    const out = new Set();

    for (const [word, number] of Object.entries(BED_WORDS)) {
      const re = new RegExp(
        "\\b" + word + "\\s*(?:bed|bedroom|bedrooms)\\b",
        "g"
      );

      if (re.test(q)) {
        out.add(number);
      }
    }

    for (const m of q.matchAll(
      /([0-9])\s*[- ]*(?:br|bed|bedroom|bedrooms)\b/g
    )) {
      out.add(m[1]);
    }

    for (const m of q.matchAll(
      /([0-9])\s*(?:or|to|and|\/|-)\s*([0-9])\s*(?:br|bed|bedroom|bedrooms)\b/g
    )) {
      out.add(m[1]);
      out.add(m[2]);
    }

    if (q.includes("studio")) {
      out.add("0");
    }

    return Array.from(out);
  }

  function cardBedrooms(data){
    const out = new Set();

    if (
      data.type.includes("studio") ||
      data.units.includes("studio")
    ) {
      out.add("0");
    }

    // Explicit ranges such as 1–4 BR / 1-4 BR
    const range = data.units.match(
      /([0-9]+)\s*(?:-|–|—|to)\s*([0-9]+)\s*(?:br|bedroom|bedrooms)?/
    );

    if (range) {
      const a = Number(range[1]);
      const b = Number(range[2]);

      if (
        Number.isFinite(a) &&
        Number.isFinite(b) &&
        a <= b &&
        b - a <= 20
      ) {
        for (let i = a; i <= b; i++) {
          out.add(String(i));
        }
      }
    }

    // Lists such as 1 | 2 | 3 | 4 BR
    const nums = data.units.match(/[0-9]+/g) || [];

    for (const n of nums) {
      const x = Number(n);

      if (
        Number.isFinite(x) &&
        x >= 0 &&
        x <= 20
      ) {
        out.add(String(x));
      }
    }

    return out;
  }

  // ---------------------------------------------------------
  // Budget ±10%
  // ---------------------------------------------------------

  function amount(number, suffix, fallbackSuffix = ""){
    let n = Number(number);

    if (!Number.isFinite(n)) {
      return 0;
    }

    const s = String(
      suffix || fallbackSuffix || ""
    ).toLowerCase();

    if (s === "m" || s === "million") {
      n *= 1000000;
    }

    if (s === "k" || s === "thousand") {
      n *= 1000;
    }

    return n;
  }

  function parseBudget(query){
    const q = String(query || "")
      .toLowerCase()
      .replace(/,/g, "")
      .replace(/\s+/g, " ")
      .trim();

    let m;

    // 3-5M / 3M to 5M
    m = q.match(
      /(?:aed\s*)?(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?\s*(?:-|–|—|to)\s*(?:aed\s*)?(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?\b/
    );

    if (m) {
      const a = amount(m[1], m[2], m[4]);
      const b = amount(m[3], m[4], m[2]);

      if (a && b) {
        const preferredMin = Math.min(a, b);
        const preferredMax = Math.max(a, b);

        return {
          kind: "range",
          preferredMin,
          preferredMax,
          min: preferredMin * (1 - PRICE_TOLERANCE),
          max: preferredMax * (1 + PRICE_TOLERANCE)
        };
      }
    }

    // under / below / max / up to
    m = q.match(
      /(?:under|below|up to|maximum|max|no more than)\s*(?:around\s*)?(?:aed\s*)?(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?\b/
    );

    if (m) {
      const value = amount(m[1], m[2]);

      if (value) {
        return {
          kind: "max",
          preferredMax: value,
          max: value * (1 + PRICE_TOLERANCE)
        };
      }
    }

    // above / over / from / at least
    m = q.match(
      /(?:over|above|from|minimum|min|at least)\s*(?:around\s*)?(?:aed\s*)?(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?\b/
    );

    if (m) {
      const value = amount(m[1], m[2]);

      if (value) {
        return {
          kind: "min",
          preferredMin: value,
          min: value * (1 - PRICE_TOLERANCE)
        };
      }
    }

    // around / about / budget 4M
    m = q.match(
      /(?:around|about|approximately|approx|roughly|budget(?:\s+of|\s+around)?)\s*(?:aed\s*)?(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?\b/
    );

    if (m) {
      const value = amount(m[1], m[2]);

      if (value) {
        return {
          kind: "around",
          preferred: value,
          min: value * (1 - PRICE_TOLERANCE),
          max: value * (1 + PRICE_TOLERANCE)
        };
      }
    }

    // Plain "AED 4M"
    m = q.match(
      /\baed\s*(\d+(?:\.\d+)?)\s*(m|million|k|thousand)?\b/
    );

    if (m) {
      const value = amount(m[1], m[2]);

      if (value) {
        return {
          kind: "around",
          preferred: value,
          min: value * (1 - PRICE_TOLERANCE),
          max: value * (1 + PRICE_TOLERANCE)
        };
      }
    }

    return null;
  }

  function budgetPass(price, budget){
    if (!budget) return true;
    if (!price) return false;

    if (
      typeof budget.min === "number" &&
      price < budget.min
    ) {
      return false;
    }

    if (
      typeof budget.max === "number" &&
      price > budget.max
    ) {
      return false;
    }

    return true;
  }

  function budgetScore(price, budget){
    if (!budget || !price) {
      return 0;
    }

    if (
      budget.kind === "max" &&
      price <= budget.preferredMax
    ) {
      return 30;
    }

    if (
      budget.kind === "min" &&
      price >= budget.preferredMin
    ) {
      return 30;
    }

    if (
      budget.kind === "range" &&
      price >= budget.preferredMin &&
      price <= budget.preferredMax
    ) {
      return 30;
    }

    if (
      budget.kind === "around" &&
      budget.preferred
    ) {
      const delta =
        Math.abs(price - budget.preferred) /
        budget.preferred;

      return Math.max(
        12,
        30 - Math.round(delta * 100)
      );
    }

    // Попал только в мягкие ±10%
    return 12;
  }

  function detectSemantics(query){
    const q = normalText(query);
    const out = [];

    if (
      q.includes("waterfront") ||
      q.includes("beachfront") ||
      q.includes("seafront") ||
      /\bnear (?:the )?(?:sea|beach|water)\b/.test(q) ||
      /\bby (?:the )?(?:sea|beach|water)\b/.test(q) ||
      /\bclose to (?:the )?(?:sea|beach|water)\b/.test(q)
    ) {
      out.push("waterfront");
    }

    if (/\b(?:sea|ocean|water) view\b/.test(q)) {
      out.push("sea-view");
    }

    if (q.includes("park view")) {
      out.push("park-view");
    }

    if (
      q.includes("city view") ||
      q.includes("skyline view")
    ) {
      out.push("city-view");
    }

    if (
      q.includes("luxury") ||
      q.includes("premium") ||
      q.includes("high end") ||
      q.includes("high-end")
    ) {
      out.push("luxury");
    }

    if (
      q.includes("family") ||
      q.includes("children") ||
      q.includes("kids")
    ) {
      out.push("family");
    }

    if (
      q.includes("investment") ||
      q.includes("investor") ||
      q.includes("invest ") ||
      q.includes("roi") ||
      q.includes("rental yield")
    ) {
      out.push("investment");
    }

    if (
      q.includes("modern") ||
      q.includes("contemporary")
    ) {
      out.push("modern");
    }

    return Array.from(new Set(out));
  }

  function discoveryScore(data){
    let score = 0;

    // Сильный визуальный bonus только для Discovery.
    if (data.hasImage) score += 60;

    if (data.price) score += 8;
    if (data.developer) score += 8;
    if (data.location) score += 8;
    if (data.type) score += 8;
    if (data.units) score += 6;
    if (data.handover) score += 5;

    if (
      data.search.includes("luxury") ||
      data.search.includes("premium")
    ) {
      score += 12;
    }

    if (
      data.search.includes("waterfront") ||
      data.search.includes("beachfront") ||
      data.search.includes("sea view")
    ) {
      score += 15;
    }

    // Цена не штрафуется.
    // Дорогие красивые проекты могут быть выше в Discovery.
    if (
      data.hasImage &&
      data.price >= 10000000
    ) {
      score += 6;
    }

    if (
      data.hasImage &&
      data.price >= 20000000
    ) {
      score += 4;
    }

    return score;
  }

  function renderDiscovery(cards){
