      .map(x => ({
        ...x,
        score: discoveryScore(x.data)
      }))
      .sort((a, b) => {
        if (b.score !== a.score) {
          return b.score - a.score;
        }

        return a.data.title.localeCompare(
          b.data.title
        );
      });

    const chosen = [];
    const chosenSet = new Set();

    const developerCount = new Map();
    const districtCount = new Map();

    for (const x of items) {
      if (chosen.length >= RESULT_LIMIT) break;

      const dev = x.data.developer;
      const district = x.data.location;

      const dc = dev
        ? (developerCount.get(dev) || 0)
        : 0;

      const lc = district
        ? (districtCount.get(district) || 0)
        : 0;

      if (dev && dc >= 6) continue;
      if (district && lc >= 8) continue;

      chosen.push(x);
      chosenSet.add(x.a);

      if (dev) {
        developerCount.set(dev, dc + 1);
      }

      if (district) {
        districtCount.set(district, lc + 1);
      }
    }

    // Если caps не дали набрать 100 — дозаполняем.
    for (const x of items) {
      if (chosen.length >= RESULT_LIMIT) break;
      if (chosenSet.has(x.a)) continue;

      chosen.push(x);
      chosenSet.add(x.a);
    }

    for (const a of cards) {
      a.style.display = "none";
    }

    const grid = rootGrid();

    for (const x of chosen) {
      hydrateProjectCard(x.a);
      x.a.style.display = "";

      if (grid) {
        grid.appendChild(x.a);
      }
    }

    const root = getResultsRoot();

    root.dataset.searchState = "discovery";
    root.dataset.resultsCount = String(chosen.length);
    root.dataset.resultsShown = String(chosen.length);
  }

  function rootGrid(){
    const root = getResultsRoot();

    return root
      ? root.querySelector(".results__grid")
      : null;
  }

  // ---------------------------------------------------------
  // Ranked Search
  // ---------------------------------------------------------

  let SEARCH_APPLY_SEQUENCE = 0;

  async function applyFilter(q){
    const sequence =
      ++SEARCH_APPLY_SEQUENCE;

    const root =
      getResultsRoot();

    if (!root) return;

    const query =
      String(q || "").trim();

    if (query) {
      const detectedLang =
        detectSearchLanguage(
          query
        );

      if (
        detectedLang !==
        PROJECT_DATA_LANG
      ) {
        await activateSearchLanguage(
          detectedLang,
          sequence
        );

        // User continued typing while
        // the projection was loading.
        if (
          sequence !==
          SEARCH_APPLY_SEQUENCE
        ) {
          return;
        }
      }
    }

    ensureProjectCardShells();

    const cards =
      getCards();

    root.dataset.searchLanguage =
      PROJECT_DATA_LANG;

    // EMPTY QUERY = Discovery 100.
    if (!query) {
      renderDiscovery(cards);
      return;
    }

    const lang = getLang();

    const entities = resolveSearchEntities(query);

    const relationRequested = !!entities.relation;
    const relationActive = !!(
      entities.relation &&
      entities.anchor
    );

    const modifierText = relationRequested
      ? String(
          entities.relation?.modifierText || ""
        ).trim()
      : "";

    const modifierCheaper =
      relationActive &&
      /\bcheaper\b/i.test(modifierText);

    const modifierAnotherDistrict =
      relationActive &&
      /\banother\s+(?:district|area)\b/i.test(
        modifierText
      );

    const modifierAnotherDeveloper =
      relationActive &&
      /\banother\s+developer\b/i.test(
        modifierText
      );

    // Relation anchor itself is NOT ordinary search text.
    // Only the modifier goes through normal filters.
    //
    // "similar to Passo under AED 5M"
    // → parserQuery = "under AED 5M"
    //
    // "same district as Passo, 2 bedrooms"
    // → parserQuery = "2 bedrooms"
    const rawParserQuery = relationRequested
      ? modifierText
          .replace(/\bcheaper\b/gi, " ")
          .replace(
            /\b(?:in\s+)?another\s+(?:district|area)\b/gi,
            " "
          )
          .replace(
            /\b(?:(?:by|from)\s+)?another\s+developer\b/gi,
            " "
          )
          .replace(/\s+/g, " ")
          .trim()
      : query;

    const parserQuery =
      canonicalizeSearchParserQuery(
        rawParserQuery,
        lang
      );

    const parts = splitQueryToParts(
      parserQuery,
      lang
    );

    const types = detectTypes(parserQuery);
    const bedrooms = detectBedrooms(parserQuery);
    const budget = parseBudget(parserQuery);
    const semantics = detectSemantics(parserQuery);

    const years = Array.from(
      new Set(
        String(parserQuery).match(
          /\b20(?:2[0-9]|3[0-9])\b/g
        ) || []
      )
    );

    const wantsPayment =
      /\bpayment plan\b/i.test(parserQuery) ||
      /\binstallment\b/i.test(parserQuery) ||
      /\binstalment\b/i.test(parserQuery);

    const weak = parts.weak.filter(t => {
      const x = String(t).toLowerCase();

      if (SEARCH_NOISE.has(x)) return false;
      if (EMIRATE_SET.has(x)) return false;
      if (STRONG_TOKEN_SET.has(x)) return false;

      if (/^[0-9]+$/.test(x)) return false;

      if (
        /^[0-9]+(?:\.[0-9]+)?(?:m|k)$/.test(x)
      ) {
        return false;
      }

      if (
        /^20(?:2[0-9]|3[0-9])$/.test(x)
      ) {
        return false;
      }

      return x.length >= 2;
    });

    if (
      relationRequested &&
      !relationActive
    ) {
      for (const a of cards) {
        a.style.display = "none";
      }

      root.dataset.searchState = "empty";
      root.dataset.resultsCount = "0";
      root.dataset.resultsShown = "0";

      return;
    }

    const ranked = [];

    for (const a of cards) {
      const data = cardData(a);

      // HARD — Emirate
      if (parts.emiratesWanted.length) {
        const ok = parts.emiratesWanted.some(e =>
          cardHasEmirate(data, e)
        );

        if (!ok) continue;
      }

      // HARD — resolved Developer entity
      if (entities.developer) {
        if (
          entityKey(data.developer) !==
          entityKey(entities.developer)
        ) {
          continue;
        }
      }

      // HARD — resolved District entity
      if (entities.district) {
        if (
          entityKey(data.location) !==
          entityKey(entities.district)
        ) {
          continue;
        }
      }

      // HARD — Project relation
      if (relationActive) {
        const crossMode =
          modifierAnotherDistrict ||
          modifierAnotherDeveloper;

        const relationOk = crossMode
          ? crossEntityCandidatePass(
              data,
              entities,
              modifierAnotherDistrict,
              modifierAnotherDeveloper
            )
          : relationCandidatePass(
              data,
              entities
            );

        if (!relationOk) {
          continue;
        }
      }

      // HARD — relation modifier: cheaper than anchor
      if (modifierCheaper) {
        const anchorPrice = Number(
          entities.anchor?.price_amount || 0
        );

        if (
          !anchorPrice ||
          !data.price ||
          data.price >= anchorPrice
        ) {
          continue;
        }
      }

      // HARD — Property type
      if (types.length) {
        const ok = types.some(t =>
          data.type.includes(t)
        );

        if (!ok) continue;
      }

      // HARD — Bedrooms
      if (bedrooms.length) {
        const available = cardBedrooms(data);

        const ok = bedrooms.some(x =>
          available.has(x)
        );

        if (!ok) continue;
      }

      // HARD-ish — Budget with ±10% tolerance
      if (!budgetPass(data.price, budget)) {
        continue;
      }

      // HARD — Handover year
      if (years.length) {
        const ok = years.some(y =>
          data.handover.includes(y)
        );

        if (!ok) continue;
      }

      // Payment plan только если реально заполнен.
      if (
        wantsPayment &&
        !data.paymentPlan
      ) {
        continue;
      }

      let score = 0;
      let matches = 0;

      const nq = normalText(query);

      if (relationActive) {
        const crossMode =
          modifierAnotherDistrict ||
          modifierAnotherDeveloper;

        if (crossMode) {
          const metrics =
            crossEntityRelationMetrics(
              data,
              entities
            );

          score += metrics
            ? metrics.score
            : 0;
        } else {
          score += relationCandidateScore(
            data,
            entities
          );
        }

        matches++;
      }

      // Exact entity signals
      if (
        data.title &&
        nq.includes(data.title)
      ) {
        score += 120;
        matches++;
      }

      if (
        data.developer &&
        nq.includes(data.developer)
      ) {
        score += 70;
        matches++;
      }

      if (
        data.location &&
        nq.includes(data.location)
      ) {
        score += 70;
        matches++;
      }

      // Structured signals
      if (parts.emiratesWanted.length) {
        score += 25;
      }

      if (entities.developer) {
        score += 45;
      }

      if (entities.district) {
        score += 45;
      }

      if (types.length) {
        score += 35;
      }

      if (bedrooms.length) {
        score += 40;
      }

      if (budget) {
        score += budgetScore(
          data.price,
          budget
        );
      }

      if (years.length) {
        score += 25;
      }

      if (wantsPayment) {
        score += 25;
      }

      // Free human-language words:
      // project / developer / district first,
      // semantic body second.
      for (const token of weak) {
        let tokenScore = 0;

        if (data.title.includes(token)) {
          tokenScore = 30;
        } else if (
          data.developer.includes(token)
        ) {
          tokenScore = 24;
        } else if (
          data.location.includes(token)
        ) {
          tokenScore = 24;
        } else if (
          data.type.includes(token)
        ) {
          tokenScore = 18;
        } else if (
          data.search.includes(token)
        ) {
          tokenScore = 6;
        }

        if (tokenScore) {
          score += tokenScore;
          matches++;
        }
      }

      // Lifestyle preferences are ranking signals,
      // not mandatory filters.
      for (const semantic of semantics) {
        if (
          semanticMatch(data, semantic)
        ) {
          score += 18;
          matches++;
        }
      }

      const hasHard =
        relationActive ||
        parts.emiratesWanted.length > 0 ||
        !!entities.developer ||
        !!entities.district ||
        types.length > 0 ||
        bedrooms.length > 0 ||
        !!budget ||
        years.length > 0 ||
        wantsPayment;

      // Если запрос только текстовый:
      // Passo / Beyond / Palm Jumeirah / sea view —
      // должно быть реальное совпадение.
      if (
        !hasHard &&
        matches === 0
      ) {
        continue;
      }

      ranked.push({
        a,
        data,
        score
      });
    }

    ranked.sort((a, b) => {
      if (b.score !== a.score) {
        return b.score - a.score;
      }

      return a.data.title.localeCompare(
        b.data.title
      );
    });

    // Никогда не показываем все 2571.
    for (const a of cards) {
      a.style.display = "none";
    }

    const visible = ranked.slice(
      0,
      RESULT_LIMIT
    );

    const grid = rootGrid();

    for (const x of visible) {
      hydrateProjectCard(x.a);
      x.a.style.display = "";

      if (grid) {
        grid.appendChild(x.a);
      }
    }

    root.dataset.searchState =
      visible.length
        ? "results"
        : "empty";

    root.dataset.resultsCount =
      String(ranked.length);

    root.dataset.resultsShown =
      String(visible.length);

    // ZERO MATCH stays zero.
    // No fallback to all projects.
  }

  function readSavedQuery(){
    try { return (localStorage.getItem(STORAGE_KEY) || "").trim(); } catch(e){ return ""; }
  }

  function writeSavedQuery(v){
    const s = String(v || "").trim();
    try {
      if (s) localStorage.setItem(STORAGE_KEY, s);
      else localStorage.removeItem(STORAGE_KEY);
    } catch(e){}
  }

  function parseEmiratesFromQueryText(q){
    const parts = String(q || "")
      .split(/[\u00B7•,|/]+/g)
      .map(s => s.trim())
      .filter(Boolean);

    const out = [];
    for (const p of parts) {
      const c = canonEmirateFromText(p);
      if (c) out.push(c);
    }
    return out;
  }

  function rebuildCanonQuery(emiratesCanon, keepText){
    const base = Array.from(new Set(emiratesCanon)).join(" · ");
    const tail = String(keepText || "").trim();
    if (!tail) return base;
    if (!base) return tail;
    return (tail + " · " + base).trim();
  }

  window.addEventListener("search:set", function(e){
    const q = (e.detail && e.detail.q) ? String(e.detail.q) : "";
    applyFilter(q);
  });

  window.addEventListener("search:updated", function(e){
    const q = (e && e.detail && typeof e.detail.q !== "undefined")
      ? String(e.detail.q)
      : (getResultsInput() ? (getResultsInput().value || "") : "");
    applyFilter(q);
  });

  window.addEventListener("search:clear", function(){
    applyFilter("");
  });

  document.addEventListener("click", function(ev){
    const btn = ev.target && ev.target.closest ? ev.target.closest(".home-hero__chip") : null;
    if (!btn) return;

    // Hero owns chips that have an explicit search query.
    // Do not merge them with the text already typed by the user.
    if (btn.hasAttribute("data-chip-query")) return;

    const txt = (btn.textContent || "").trim();
    const emir = canonEmirateFromText(txt);
    if (!emir) return;

    ev.preventDefault();
    ev.stopPropagation();
    if (typeof ev.stopImmediatePropagation === "function") ev.stopImmediatePropagation();

    const heroInput = document.querySelector(".home-hero__input");
    const rInput = getResultsInput();

    const currentText = heroInput ? (heroInput.value || "") : (rInput ? (rInput.value || "") : readSavedQuery());

    const lang = getLang();
    const normalizer = buildNormalizer(DICT, lang);
    const tokens = normalizer.normalize(currentText);

    const existingEmirs = parseEmiratesFromQueryText(currentText);
    const set = new Set(existingEmirs);
    set.add(emir);

    const emirsDetected = new Set(detectEmiratesFromTokens(tokens));
    const typedTokens = tokens.filter(t => !emirsDetected.has(canonEmirateFromText(t)) && !EMIRATE_SET.has(t));
    const typedText = typedTokens.join(" ").trim();

    const canonQuery = rebuildCanonQuery(Array.from(set), typedText);
    writeSavedQuery(canonQuery);

    const labels = [];
    if (typedText) labels.push(typedText);

    for (const c of Array.from(set)) {
      if (c === emir) {
        labels.push(txt);
      } else {
        if (c === "dubai") labels.push("Dubai");
        if (c === "abu-dhabi") labels.push("Abu Dhabi");
        if (c === "sharjah") labels.push("Sharjah");
        if (c === "ras-al-khaimah") labels.push("Ras Al Khaimah");
      }
    }

    const displayText = labels.join(" · ").trim();

    if (heroInput) heroInput.value = displayText;
    if (rInput) rInput.value = displayText;

    try { window.dispatchEvent(new CustomEvent("search:set", { detail: { q: canonQuery } })); } catch(e){}
  }, true);

  window.addEventListener("i18n:applied", function(){
    const q = readSavedQuery();
    applyFilter(q);
  });

  (async function boot(){
    const saved =
      readSavedQuery();

    const pageLang =
      getPageLang();

    const bootSequence =
      SEARCH_APPLY_SEQUENCE;

    await activateSearchLanguage(
      pageLang,
      bootSequence
    );

    // User started a newer Search while the
    // initial page-language projection loaded.
    if (
      bootSequence !==
      SEARCH_APPLY_SEQUENCE
    ) {
      return;
    }

    if (saved) {
      applyFilter(saved);
    }
  })();

})();
</script>
