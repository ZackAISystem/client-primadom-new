{{ $locale := partial "home/locale_data.html" . }}
{{ $home := $locale.home }}
{{ $results := $locale.results }}
{{ $a11y := $locale.a11y }}

<section id="results" class="results" aria-hidden="true">

  {{/* Search V2 — cards are rendered client-side from compact projection. */}}

  <!-- sticky search -->
  <div class="results__sticky">
    <div class="results__sticky-inner">
      <div class="results__bar">

        <button class="results__brand" type="button" aria-label="{{ $results.close_return | default "Close results and return to Prima AI" }}">
          <span class="results__brand-dot"></span>
          <span>Prima AI</span>
        </button>

        <input
          id="resultsQuery"
          class="results__query results__query--input"
          type="text"
          placeholder="{{ $results.placeholder | default "Type your search..." }}"
          autocomplete="off"
        >

        <button class="results__voice" type="button" aria-label="{{ $results.voice_search | default "Voice search" }}">
          <span class="results__voice-aura"></span>
          <span class="results__voice-core">
            <img src="{{ $home.hero.search.voice_icon | default "/img/icons/mic.svg" | relURL }}" alt="">
          </span>
        </button>

        <button class="results__clear" type="button" aria-label="{{ $results.close_results | default "Close search results" }}">
          <span></span>
        </button>

      </div>
    </div>
  </div>

  <div class="results__grid results__grid--four">
  </div>

  <div class="results__bottom-space"></div>

</section>


<script>
(function () {
  const section = document.getElementById('results');
  if (!section || section.dataset.resultsUiReady === '1') return;
  section.dataset.resultsUiReady = '1';

  const input = section.querySelector('#resultsQuery');
  const clearBtn = section.querySelector('.results__clear');
  const brandBtn = section.querySelector('.results__brand');
  const voiceBtn = section.querySelector('.results__voice');

  function dispatchSearch(q) {
    const value = String(q || '').trim();

    try {
      window.dispatchEvent(new CustomEvent('search:updated', {
        detail: { q: value }
      }));
    } catch (e) {}
  }

  function dispatchClear() {
    try {
      window.dispatchEvent(new CustomEvent('search:clear'));
    } catch (e) {}
  }

  function syncInput(value) {
    if (!input) return;

    input.value = String(value || '');
    dispatchSearch(input.value);
  }

  function closeResults() {
    section.classList.remove('is-open');
    section.setAttribute('aria-hidden', 'true');

    if (input) {
      input.value = '';
    }

    dispatchClear();

    const top = document.getElementById('top') || document.querySelector('.home-hero') || document.body;
    top.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  if (input) {
    input.addEventListener('input', function () {
      dispatchSearch(input.value);
    });

    input.addEventListener('change', function () {
      dispatchSearch(input.value);
    });
  }

  if (clearBtn) {
    clearBtn.addEventListener('click', function (event) {
      event.preventDefault();
      closeResults();
    });
  }

  if (brandBtn) {
    brandBtn.addEventListener('click', function (event) {
      event.preventDefault();
      closeResults();
    });
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let finalVoiceText = '';

  function setVoice(active) {
    listening = active;

    if (voiceBtn) {
      voiceBtn.classList.toggle('is-active', active);
    }
  }

  function normalizeText(text) {
    return String(text || '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  if (SpeechRecognition && input && voiceBtn) {
    recognition = new SpeechRecognition();
    recognition.lang = document.documentElement.lang || 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = function () {
      finalVoiceText = '';
      input.value = '';
      input.focus();
      setVoice(true);
    };

    recognition.onresult = function (event) {
      let interimText = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const part = event.results[i][0].transcript || '';

        if (event.results[i].isFinal) {
          finalVoiceText = normalizeText(finalVoiceText + ' ' + part);
        } else {
          interimText = normalizeText(interimText + ' ' + part);
        }
      }

      const liveText = normalizeText(finalVoiceText + ' ' + interimText);

      if (liveText) {
        syncInput(liveText);
      }
    };

    recognition.onend = function () {
      setVoice(false);
      if (input) {
        input.value = normalizeText(input.value);
        dispatchSearch(input.value);
      }
    };

    recognition.onerror = function () {
      setVoice(false);
    };

    voiceBtn.addEventListener('click', function () {
      try {
        if (listening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      } catch (e) {
        setVoice(false);
      }
    });
  }
})();
</script>
