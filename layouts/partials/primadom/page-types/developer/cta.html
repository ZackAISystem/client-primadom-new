{{- $d := partial "primadom/page-types/developer/_data.html" . -}}
{{- $t := $d.t -}}
<article class="pd-cta" id="contact">
  <div>
    <h2>{{ $t.cta.title }}</h2>
    <p>{{ $t.cta.text }}</p>
  </div>
  <div class="pd-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" {{ if .modal }}data-open-developer-lead{{ end }}>{{ .label }}</a>
    {{ end }}
  </div>
</article>
