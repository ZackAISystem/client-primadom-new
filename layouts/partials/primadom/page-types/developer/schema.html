{{- $d := partial "primadom/page-types/developer/_data.html" . -}}
{{- $raw := $d.raw -}}
{{- $t := $d.t -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "{{ $t.seo.canonical }}#webpage",
      "url": "{{ $t.seo.canonical }}",
      "name": {{ $t.seo.title | jsonify }},
      "description": {{ $t.seo.description | jsonify }},
      "inLanguage": "{{ $d.lang }}",
      "about": {
        "@id": "{{ $t.seo.canonical }}#developer"
      },
      "breadcrumb": {
        "@id": "{{ $t.seo.canonical }}#breadcrumbs"
      }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ $t.seo.canonical }}#breadcrumbs",
      "itemListElement": [
        {{- range $index, $item := $t.hero.breadcrumbs -}}
        {{- if gt $index 0 }},{{ end }}
        {
          "@type": "ListItem",
          "position": {{ add $index 1 }},
          "name": {{ $item.label | jsonify }},
          "item": {{ printf "https://primadom.ai%s" $item.href | jsonify }}
        }
        {{- end }}
      ]
    },
    {
      "@type": "Organization",
      "@id": "{{ $t.seo.canonical }}#developer",
      "name": {{ $raw.developer_name | jsonify }},
      "description": {{ $t.short_summary.body_text | jsonify }},
      "areaServed": {
        "@type": "Country",
        "name": "United Arab Emirates"
      },
      "knowsAbout": {{ $raw.schema.knows_about | jsonify }}
    },
    {
      "@type": "ItemList",
      "@id": "{{ $t.seo.canonical }}#project-list",
      "name": {{ $t.projects.active_title | jsonify }},
      "itemListElement": [
        {{- range $index, $item := $t.projects.active_items -}}
        {{- if gt $index 0 }},{{ end }}
        {
          "@type": "ListItem",
          "position": {{ add $index 1 }},
          "name": {{ $item.label | jsonify }}
        }
        {{- end }}
      ]
    },
    {
      "@type": "FAQPage",
      "@id": "{{ $t.seo.canonical }}#faq",
      "mainEntity": [
        {{- range $index, $item := $t.faq.items -}}
        {{- if gt $index 0 }},{{ end }}
        {
          "@type": "Question",
          "name": {{ $item.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ $item.answer | jsonify }}
          }
        }
        {{- end }}
      ]
    }
  ]
}
</script>
