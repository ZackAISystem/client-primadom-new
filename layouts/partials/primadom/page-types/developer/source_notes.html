{{- $d := partial "primadom/page-types/developer/_data.html" . -}}
{{- $t := $d.t -}}
{{- with $t.source_notes -}}
<article class="pd-source-notes" id="source-notes">
  <div class="pd-source-notes__inner">
    <div class="pd-source-notes__copy">
      <span>{{ .eyebrow }}</span>
      <h2>{{ .title }}</h2>
      <p>{{ .text }}</p>
    </div>

    <div class="pd-source-notes__meta" aria-label="{{ .meta_aria }}">
      {{ range .items }}
        <div>
          <span>{{ .label }}</span>
          <strong>{{ .value }}</strong>
        </div>
      {{ end }}
    </div>
  </div>
</article>
{{- end -}}
