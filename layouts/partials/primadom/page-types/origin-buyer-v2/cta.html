{{- $d := partial "primadom/page-types/origin-buyer-v2/_data.html" . -}}
{{- $t := $d.t -}}
<article class="ob-cta" id="contact">
  <div><h2>{{ replaceRE "(?i)primadom ai" "Prima AI" $t.cta.title }}</h2><p>{{ replaceRE "(?i)primadom ai" "Prima AI" $t.cta.text }}</p></div>
  <div class="ob-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" {{ if .modal }}data-open-origin-buyer-lead{{ end }}>{{ replaceRE "(?i)primadom ai" "Prima AI" .label }}</a>
    {{ end }}
  </div>
</article>
