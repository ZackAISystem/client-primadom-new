{{- $d := partial "primadom/page-types/intent-v2/_data.html" . -}}
{{- $t := $d.t -}}
<article class="pi-cta" id="contact">
  <div>
    <h2>{{ $t.cta.title }}</h2>
    <p>{{ $t.cta.text }}</p>
  </div>
  <div class="pi-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" {{ if .modal }}data-open-intent-lead{{ end }}>{{ .label }}</a>
    {{ end }}
  </div>
</article>
