{{- $d := partial "primadom/page-types/origin-buyer/_data.html" . -}}
{{- $t := $d.t -}}
<article class="ob-cta" id="contact">
  <div><h2>{{ $t.cta.title }}</h2><p>{{ $t.cta.text }}</p></div>
  <div class="ob-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" {{ if .modal }}data-open-origin-buyer-lead{{ end }}>{{ .label }}</a>
    {{ end }}
  </div>
</article>
