{{- $d := partial "primadom/page-types/origin-buyer/_data.html" . -}}
{{- $t := $d.t -}}
<header class="ob-header">
  <div class="ob-header__inner">
    <a class="ob-header__badge" href="{{ $t.header.brand_url }}" aria-label="{{ $t.header.brand }}">
      <span class="ob-header__badge-dot" aria-hidden="true"></span>
      <span>{{ $t.header.brand }}</span>
    </a>

    <nav class="ob-header__nav" aria-label="{{ $t.header.nav_aria }}">
      {{ range $t.header.nav }}
        <a class="ob-header__nav-link{{ if .active }} is-active{{ end }}{{ if .ai }} ob-header__nav-link--ai{{ end }}" href="{{ .href }}">{{ .label }}</a>
      {{ end }}
    </nav>

    <div class="ob-header__right">
      <a class="ob-header__cta" href="{{ $t.header.cta_url }}" data-open-origin-buyer-lead>{{ $t.header.cta_label }}</a>
    </div>
  </div>
</header>
