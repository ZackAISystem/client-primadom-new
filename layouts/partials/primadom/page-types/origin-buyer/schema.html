{{- $d := partial "primadom/page-types/origin-buyer/_data.html" . -}}
{{- $t := $d.t -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "{{ $t.seo.canonical }}#webpage",
      "url": "{{ $t.seo.canonical }}",
      "name": {{ $t.seo.title | jsonify }},
      "description": {{ $t.seo.description | jsonify }},
      "inLanguage": "{{ $d.lang }}",
      "breadcrumb": {"@id":"{{ $t.seo.canonical }}#breadcrumbs"},
      "mainEntity": {"@id":"{{ $t.seo.canonical }}#origin-scenario"}
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ $t.seo.canonical }}#breadcrumbs",
      "itemListElement": [
        {{- range $index, $item := $t.hero.breadcrumbs -}}
        {{- if gt $index 0 }},{{ end }}
        {"@type":"ListItem","position":{{ add $index 1 }},"name":{{ $item.label | jsonify }},"item":{{ printf "https://primadom.ai%s" $item.href | jsonify }}}
        {{- end }}
      ]
    },
    {
      "@type": "Thing",
      "@id": "{{ $t.seo.canonical }}#origin-scenario",
      "name": {{ $t.hero.title | jsonify }},
      "description": {{ $t.can_buy.body_text | jsonify }}
    },
    {
      "@type": "ItemList",
      "@id": "{{ $t.seo.canonical }}#recommended-options",
      "name": {{ $t.schema.recommended_options_name | jsonify }},
      "itemListElement": [
        {{- range $index, $item := $t.projects.items -}}
        {{- if gt $index 0 }},{{ end }}
        {"@type":"ListItem","position":{{ add $index 1 }},"name":{{ $item.label | jsonify }}}
        {{- end }}
      ]
    },
    {
      "@type": "FAQPage",
      "@id": "{{ $t.seo.canonical }}#faq",
      "mainEntity": [
        {{- range $index, $item := $t.faq.items -}}
        {{- if gt $index 0 }},{{ end }}
        {"@type":"Question","name":{{ $item.question | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ $item.answer | jsonify }}}}
        {{- end }}
      ]
    }
  ]
}
</script>
