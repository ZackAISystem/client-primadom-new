{{- $d := partial "primadom/page-types/ai-answer-v2/_data.html" . -}}
{{- $t := $d.t -}}
<article class="aa-cta" id="contact">
  <div><h2>{{ $t.cta.title }}</h2><p>{{ $t.cta.text }}</p></div>
  <div class="aa-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" {{ if .modal }}data-open-ai-answer-lead{{ end }}>{{ .label }}</a>
    {{ end }}
  </div>
</article>
