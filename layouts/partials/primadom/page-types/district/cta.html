{{- $d := partial "primadom/page-types/district/_data.html" . -}}
{{- $t := $d.t -}}
<div class="pa-grid pa-grid--equal" id="sources">
  <article class="pa-card">
    <header class="pa-card__head">
      <h2>{{ $t.source_notes.title }}</h2>
      <span>{{ $t.source_notes.eyebrow }}</span>
    </header>
    <div class="pa-card__body">
      <p class="pa-answer">{{ $t.source_notes.body }}</p>
      <p class="pa-disclaimer">{{ $t.source_notes.last_updated }}</p>
    </div>
  </article>
</div>

<section class="pa-cta" id="lead">
  <div>
    <h2>{{ $t.cta.title }}</h2>
    <p>{{ $t.cta.text }}</p>
  </div>
  <div class="pa-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" data-pa-modal="open">{{ .label }}</a>
    {{ end }}
  </div>
</section>
