{{- $d := partial "primadom/page-types/buyer-scenario/_data.html" . -}}
{{- $t := $d.t -}}
<article class="bs-cta" id="contact">
  <div><h2>{{ $t.cta.title }}</h2><p>{{ $t.cta.text }}</p></div>
  <div class="bs-actions">
    {{ range $t.cta.actions }}
      <a href="{{ .href }}" {{ if .modal }}data-open-buyer-scenario-lead{{ end }}>{{ .label }}</a>
    {{ end }}
  </div>
</article>
