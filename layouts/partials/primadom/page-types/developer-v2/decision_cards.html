{{- $d := partial "primadom/page-types/developer-v2/_data.html" . -}}
{{- $t := $d.t -}}
<div class="pd-mini-row" aria-label="{{ $t.decision_cards_aria }}">
  {{ range $t.decision_cards }}
    <article class="pd-mini-card{{ if .dark }} pd-mini-card--dark{{ end }}">
      <span>{{ .eyebrow }}</span>
      <strong>{{ .title }}</strong>
      <p>{{ .text }}</p>
    </article>
  {{ end }}
</div>
