{{- $d := partial "primadom/page-types/developer-v2/_data.html" . -}}
{{- $t := $d.t -}}

<script>
(function () {

  /* -------------------------------------------------------
     Existing Developer Ask AI behaviour
  ------------------------------------------------------- */

  const aiForm = document.querySelector('.pd-ai');

  if (aiForm) {
    aiForm.addEventListener('submit', function (event) {
      event.preventDefault();

      document
        .getElementById('summary')
        ?.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
    });
  }



  /* -------------------------------------------------------
     Developer Lead Modal
  ------------------------------------------------------- */

  const modal =
    document.getElementById('developerLeadModal');

  if (!modal) return;


  const html =
    document.documentElement;

  const openers =
    document.querySelectorAll(
      '[data-open-developer-lead]'
    );

  const closers =
    modal.querySelectorAll(
      '[data-close-developer-lead]'
    );

  const form =
    modal.querySelector(
      '[data-developer-form]'
    );

  const requestRow =
    modal.querySelector(
      '[data-developer-modal-request-row]'
    );

  const comment =
    modal.querySelector(
      '[data-developer-modal-comment]'
    );

  const voiceBtn =
    modal.querySelector(
      '[data-developer-modal-voice]'
    );

  const voiceStatus =
    modal.querySelector(
      '[data-developer-modal-voice-status]'
    );

  const voiceText =
    modal.querySelector(
      '[data-developer-modal-voice-text]'
    );

  const submit =
    modal.querySelector(
      '.pd-lead-submit'
    );



  /* -------------------------------------------------------
     Voice contract
  ------------------------------------------------------- */

  const voiceContract = requestRow
    ? {
        listening:
          requestRow.dataset.voiceListeningStatus ||
          'Listening…',

        success:
          requestRow.dataset.voiceSuccessStatus ||
          'Got it',

        error:
          requestRow.dataset.voiceErrorStatus ||
          'Voice paused',

        errorText:
          requestRow.dataset.voiceErrorText ||
          'Type your request or try again',

        fallback:
          requestRow.dataset.voiceFallbackStatus ||
          'Voice mode',

        fallbackText:
          requestRow.dataset.voiceFallbackText ||
          'Speech recognition is not supported here',

        prompt:
          requestRow.dataset.voiceText ||
          'Ask about this developer'
      }
    : null;



  /* -------------------------------------------------------
     SpeechRecognition state
  ------------------------------------------------------- */

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition ||
    null;

  let recognition = null;
  let isListening = false;
  let receivedTranscript = false;
  let hadVoiceError = false;
  let ignoreNextEnd = false;
  let voiceTimer = null;
  let previousComment = '';



  /* -------------------------------------------------------
     Helpers
  ------------------------------------------------------- */

  function clearVoiceTimer() {
    if (!voiceTimer) return;

    window.clearTimeout(voiceTimer);
    voiceTimer = null;
  }


  function normalizeTranscript(value) {
    return String(value || '')
      .replace(/\s+/g, ' ')
      .replace(/\s+([,.!?;:])/g, '$1')
      .trim();
  }


  function setVoiceUI(active, status, text) {
    if (!requestRow || !voiceBtn) return;

    requestRow.classList.toggle(
      'is-voice-active',
      active
    );

    voiceBtn.classList.toggle(
      'is-active',
      active
    );

    voiceBtn.setAttribute(
      'aria-pressed',
      active ? 'true' : 'false'
    );

    if (status && voiceStatus) {
      voiceStatus.textContent = status;
    }

    if (
      typeof text === 'string' &&
      voiceText
    ) {
      voiceText.textContent = text;
    }
  }


  function hideVoiceUI(delay) {
    clearVoiceTimer();

    voiceTimer =
      window.setTimeout(function () {

        setVoiceUI(
          false,
          voiceContract
            ? voiceContract.listening
            : 'Listening…',
          voiceContract
            ? voiceContract.prompt
            : ''
        );

      }, delay || 0);
  }


  function restorePreviousCommentIfEmpty() {
    if (!comment) return;

    if (
      !(comment.value || '').trim() &&
      previousComment
    ) {
      comment.value = previousComment;
    }
  }



  /* -------------------------------------------------------
     SpeechRecognition implementation
  ------------------------------------------------------- */

  if (
    Recognition &&
    requestRow &&
    voiceBtn &&
    comment
  ) {

    recognition =
      new Recognition();


    const pageLanguage =
      document.documentElement.lang ||
      'en';


    recognition.lang =
      pageLanguage
        .toLowerCase()
        .startsWith('en')
        ? 'en-US'
        : pageLanguage;


    recognition.interimResults = true;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;


    recognition.onstart = function () {

      clearVoiceTimer();

      isListening = true;
      receivedTranscript = false;
      hadVoiceError = false;

      previousComment =
        comment.value || '';

      /*
       * Gold behaviour:
       * spoken request replaces the prepared request.
       */
      comment.value = '';
      comment.focus();


      setVoiceUI(
        true,
        voiceContract.listening,
        voiceContract.prompt
      );
    };


    recognition.onresult = function (event) {

      let transcript = '';


      for (
        let index = 0;
        index < event.results.length;
        index += 1
      ) {

        const result =
          event.results[index];

        if (
          result &&
          result[0] &&
          result[0].transcript
        ) {
          transcript +=
            ' ' + result[0].transcript;
        }
      }


      transcript =
        normalizeTranscript(transcript);


      if (!transcript) return;


      receivedTranscript = true;

      comment.value =
        transcript;


      const lastResult =
        event.results[
          event.results.length - 1
        ];


      if (
        lastResult &&
        lastResult.isFinal
      ) {

        setVoiceUI(
          true,
          voiceContract.success,
          transcript
        );

      } else {

        setVoiceUI(
          true,
          voiceContract.listening,
          transcript
        );

      }
    };


    recognition.onerror = function () {

      hadVoiceError = true;
      isListening = false;

      restorePreviousCommentIfEmpty();


      setVoiceUI(
        true,
        voiceContract.error,
        voiceContract.errorText
      );


      hideVoiceUI(1500);
    };


    recognition.onend = function () {

      isListening = false;


      if (ignoreNextEnd) {

        ignoreNextEnd = false;

        setVoiceUI(
          false,
          voiceContract.listening,
          voiceContract.prompt
        );

        return;
      }


      if (hadVoiceError) {
        return;
      }


      if (receivedTranscript) {

        const finalText =
          normalizeTranscript(
            comment.value
          );


        setVoiceUI(
          true,
          voiceContract.success,
          finalText
        );


        hideVoiceUI(1350);

        return;
      }


      restorePreviousCommentIfEmpty();


      setVoiceUI(
        true,
        voiceContract.error,
        voiceContract.errorText
      );


      hideVoiceUI(1200);
    };
  }



  /* -------------------------------------------------------
     Voice start / stop
  ------------------------------------------------------- */

  function startModalVoice() {

    if (
      !requestRow ||
      !voiceBtn ||
      !voiceContract
    ) {
      return;
    }


    clearVoiceTimer();


    if (!recognition) {

      setVoiceUI(
        true,
        voiceContract.fallback,
        voiceContract.fallbackText
      );


      hideVoiceUI(2200);

      return;
    }


    try {

      recognition.start();

    } catch (error) {

      setVoiceUI(
        true,
        voiceContract.error,
        voiceContract.errorText
      );


      hideVoiceUI(1500);
    }
  }


  function stopModalVoice(silent) {

    clearVoiceTimer();


    if (
      recognition &&
      isListening
    ) {

      if (silent) {
        ignoreNextEnd = true;
      }


      try {
        recognition.stop();
      } catch (error) {
        /* recognition may already be stopping */
      }
    }


    isListening = false;


    if (
      silent &&
      voiceContract
    ) {

      restorePreviousCommentIfEmpty();


      setVoiceUI(
        false,
        voiceContract.listening,
        voiceContract.prompt
      );
    }
  }



  /* -------------------------------------------------------
     Modal open / close
  ------------------------------------------------------- */

  function openModal(event) {

    if (event) {
      event.preventDefault();
    }


    modal.classList.add(
      'is-open'
    );

    modal.setAttribute(
      'aria-hidden',
      'false'
    );

    html.classList.add(
      'pd-modal-open'
    );
  }


  function closeModal(event) {

    if (event) {
      event.preventDefault();
    }


    stopModalVoice(true);


    modal.classList.remove(
      'is-open'
    );

    modal.setAttribute(
      'aria-hidden',
      'true'
    );

    html.classList.remove(
      'pd-modal-open'
    );
  }



  openers.forEach(function (button) {
    button.addEventListener(
      'click',
      openModal
    );
  });


  closers.forEach(function (button) {
    button.addEventListener(
      'click',
      closeModal
    );
  });


  document.addEventListener(
    'keydown',
    function (event) {

      if (event.key === 'Escape') {
        closeModal(event);
      }

    }
  );



  /* -------------------------------------------------------
     Voice button
  ------------------------------------------------------- */

  if (voiceBtn) {

    voiceBtn.addEventListener(
      'click',
      function () {

        if (isListening) {
          stopModalVoice(false);
        } else {
          startModalVoice();
        }

      }
    );
  }



  /* -------------------------------------------------------
     Lead submit
  ------------------------------------------------------- */

  if (form) {

    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();

        stopModalVoice(true);


        if (!submit) return;


        const normalLabel =
          submit.dataset.submitLabel ||
          submit.textContent.trim() ||
          'Send';


        const successLabel =
          submit.dataset.successLabel ||
          'Sent';


        submit.classList.add(
          'is-done'
        );

        submit.textContent =
          successLabel;


        window.setTimeout(
          function () {

            submit.textContent =
              normalLabel;

            submit.classList.remove(
              'is-done'
            );

            closeModal();

          },
          1300
        );
      }
    );
  }

})();
</script>
